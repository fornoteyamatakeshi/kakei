<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ふたり家計簿</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--
  夫婦2人だけで使うプライベートなアプリのため、検索エンジンには
  一切インデックスされないようにしている（下記のrobotsタグ）。
  Netlify等の外部ホスティングを使う場合は、同梱のrobots.txtも
  一緒に公開すること（下部の詳細設計書を参照）。
-->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<!--
  このアプリは通信環境に左右されず、スマートフォンでも単体のファイルとして
  必ず開けるように、外部フォント・外部グラフライブラリを一切使わず
  端末に内蔵されたフォントとSVGだけで描画しています。
-->
<style>
  :root{
    --paper:#F6F1E7;
    --paper-raised:#FFFFFF;
    --ink:#26313A;
    --ink-soft:#5C6B74;
    --indigo:#26456B;
    --indigo-deep:#16304D;
    --gold:#C99A3E;
    --income:#3F8564;
    --fixed:#3A5A82;
    --variable:#B4623F;
    --saving:#B4913A;
    --line:#E3D9C4;
    --danger:#B4463F;
    --shadow: 0 1px 2px rgba(38,49,58,0.06), 0 4px 14px rgba(38,49,58,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      linear-gradient(180deg, rgba(38,69,107,0.03), rgba(38,69,107,0) 220px),
      var(--paper);
    color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic Medium","YuGothic","Noto Sans CJK JP","Meiryo",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .serif{font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif CJK JP",serif;}
  .wrap{max-width:960px;margin:0 auto;padding:28px 20px 80px;}

  /* Header */
  .app-header{
    display:flex;align-items:flex-end;justify-content:space-between;
    padding-bottom:18px;margin-bottom:22px;
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:40px;height:40px;border-radius:10px;
    background:linear-gradient(135deg, var(--indigo), var(--indigo-deep));
    display:flex;align-items:center;justify-content:center;
    color:var(--paper);font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif CJK JP",serif;font-weight:700;font-size:19px;
    box-shadow:var(--shadow);
  }
  .brand-text h1{
    font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif CJK JP",serif;font-weight:700;
    font-size:23px;margin:0;letter-spacing:.02em;color:var(--indigo-deep);
  }
  .brand-text p{margin:2px 0 0;font-size:12px;color:var(--ink-soft);letter-spacing:.04em;}

  .month-nav{display:flex;align-items:center;gap:10px;}
  .month-nav button{
    width:32px;height:32px;border-radius:8px;border:1px solid var(--line);
    background:var(--paper-raised);color:var(--indigo);font-size:15px;cursor:pointer;
  }
  .month-nav button:hover{background:#EFE7D4;}
  .month-label{
    font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif CJK JP",serif;font-size:18px;font-weight:700;color:var(--indigo-deep);
    min-width:104px;text-align:center;
  }

  /* ヘッダー右側（月切り替え＋メニュー） */
  .header-controls{display:flex;align-items:center;gap:10px;}
  .hamburger-btn{
    width:36px;height:36px;border-radius:8px;border:1px solid var(--line);
    background:var(--paper-raised);color:var(--indigo-deep);font-size:17px;cursor:pointer;
    flex-shrink:0;line-height:1;
  }
  .hamburger-btn:hover{background:#EFE7D4;}

  /* ハンバーガーメニューから開くナビゲーション */
  .nav-menu{
    display:flex;flex-direction:column;gap:4px;
    background:var(--paper-raised);border:1px solid var(--line);border-radius:12px;
    padding:8px;margin-bottom:18px;box-shadow:var(--shadow);
  }
  .nav-menu-item{
    text-align:left;background:none;border:none;padding:11px 14px;border-radius:8px;
    font-size:14px;color:var(--ink);cursor:pointer;font-family:inherit;
  }
  .nav-menu-item:hover{background:#EFE7D4;}
  .nav-menu-item.active{background:var(--indigo-deep);color:#fff;}

  /* Tabs */
  .tabs{display:flex;gap:6px;margin-bottom:22px;flex-wrap:wrap;}
  .tab-btn{
    padding:9px 16px;border-radius:999px;border:1px solid var(--line);
    background:var(--paper-raised);color:var(--ink-soft);font-size:13.5px;font-weight:500;
    cursor:pointer;font-family:inherit;letter-spacing:.02em;transition:.15s;
  }
  .tab-btn.active{background:var(--indigo-deep);border-color:var(--indigo-deep);color:#fff;box-shadow:var(--shadow);}
  .tab-btn:not(.active):hover{background:#EFE7D4;}

  .panel{display:none;}
  .panel.active{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  /* Cards */
  .card{
    background:var(--paper-raised);border:1px solid var(--line);border-radius:14px;
    padding:20px;margin-bottom:18px;box-shadow:var(--shadow);
  }
  .card h2{
    font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif CJK JP",serif;font-size:16px;margin:0 0 14px;color:var(--indigo-deep);
    display:flex;align-items:center;gap:8px;
  }
  .cat-dot{width:9px;height:9px;border-radius:50%;display:inline-block;}

  /* Form */
  .entry-form{display:grid;grid-template-columns:130px 1fr 130px auto;gap:10px;align-items:end;margin-bottom:6px;}
  .entry-form.with-cat{grid-template-columns:130px 150px 1fr 130px auto;}
  .field{display:flex;flex-direction:column;gap:5px;min-width:0;}
  .field label{font-size:11.5px;color:var(--ink-soft);letter-spacing:.03em;}
  input,select{
    border:1px solid var(--line);border-radius:8px;padding:9px 10px;
    /* 16px以上にしておかないと、iOSのSafariが入力欄タップ時に画面全体を
       自動拡大してしまい、レイアウトが崩れて見える原因になるため固定している */
    font-size:16px;
    font-family:inherit;background:#FCFAF4;color:var(--ink);
    width:100%;min-width:0;box-sizing:border-box;
    max-width:100%;
  }
  select{
    /* 長い選択肢（例：子供NISA（ジュニアNISA））でもグリッド枠からはみ出さないように */
    text-overflow:ellipsis;
  }
  /*
     日付入力は iOS Safari で通常の input と異なり、ネイティブの
     日付コントロールが独自の最小幅を持つことがある。
     そのため「width:100%」だけでは、親要素より右側にはみ出す場合がある。
     appearance を通常の input と同じにし、WebKit 内部の部品も幅を制限する。
     タップ時のネイティブ日付ピッカー自体は type="date" のまま利用できる。
  */
  input[type="date"]{
    -webkit-appearance:none;
    appearance:none;
    display:block;
    width:100%;
    min-width:0;
    max-width:100%;
    inline-size:100%;
    min-inline-size:0;
    max-inline-size:100%;
    padding:9px 10px;
    overflow:hidden;
    box-sizing:border-box;
  }
  input[type="date"]::-webkit-datetime-edit,
  input[type="date"]::-webkit-datetime-edit-fields-wrapper,
  input[type="date"]::-webkit-date-and-time-value{
    width:100%;
    min-width:0;
    max-width:100%;
    margin:0;
    padding:0;
    box-sizing:border-box;
  }
  input[type="date"]::-webkit-calendar-picker-indicator{
    display:none;
  }
  @supports (-webkit-touch-callout:none){
    input[type="date"]{
      -webkit-appearance:none;
      appearance:none;
      width:100%;
      min-width:0;
      max-width:100%;
    }
  }
  input:focus,select:focus{outline:2px solid var(--indigo);outline-offset:1px;}
  .add-btn{
    background:var(--indigo-deep);color:#fff;border:none;border-radius:8px;
    padding:11px 18px;font-size:14.5px;font-weight:500;cursor:pointer;font-family:inherit;
    white-space:nowrap;min-height:44px;
  }
  .add-btn:hover{background:var(--indigo);}

  /* Table */
  table{width:100%;min-width:480px;border-collapse:collapse;margin-top:14px;font-size:13.5px;}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px;}
  th{
    text-align:left;font-weight:500;color:var(--ink-soft);font-size:11.5px;
    letter-spacing:.04em;border-bottom:1px solid var(--line);padding:0 8px 8px;
  }
  td{padding:9px 8px;border-bottom:1px solid #EFE9DB;}
  tr:last-child td{border-bottom:none;}
  .amt{font-variant-numeric:tabular-nums;text-align:right;font-weight:500;}
  .del{
    background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:16px;
    line-height:1;padding:2px 6px;border-radius:6px;
  }
  .del:hover{background:#F3E3E0;color:var(--danger);}
  /* 記録の編集（✎ボタンと、行内に開く編集フォーム） */
  .row-actions{white-space:nowrap;text-align:right;}
  .edit{
    background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:14px;
    line-height:1;padding:2px 6px;border-radius:6px;
  }
  .edit:hover{background:#E8EEF5;color:var(--indigo-deep);}
  .edit-row td{background:#F7F2E6;}
  .edit-form{margin:2px 0;grid-template-columns:130px 140px 1fr 110px 110px auto;}
  .edit-actions{display:flex;gap:8px;}
  .edit-actions .add-btn,.edit-actions .ghost-btn{min-height:44px;}
  .empty-row{color:var(--ink-soft);font-size:13px;text-align:center;padding:22px 0;}
  .cat-tag{
    font-size:11px;padding:2px 8px;border-radius:999px;color:#fff;white-space:nowrap;
  }
  .added-by-tag{
    font-size:10px;color:var(--ink-soft);
  }
  .subtotal-row td{font-weight:700;border-top:1px solid var(--line);border-bottom:none;padding-top:11px;}

  /* 変動費の予算設定・達成率表示 */
  .budget-panel{margin-bottom:6px;}
  .legend-list.with-budget li{display:block;padding:7px 0;}
  .legend-row{display:flex;justify-content:space-between;align-items:center;}
  .legend-budget{font-size:11px;margin-top:2px;}
  .budget-bar-track{
    height:5px;border-radius:3px;background:#EFE9DB;margin-top:4px;overflow:hidden;
  }
  .budget-bar-fill{height:100%;border-radius:3px;}

  /* Dashboard */
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
  .stat{
    background:var(--paper-raised);border:1px solid var(--line);border-radius:14px;
    padding:16px 18px;box-shadow:var(--shadow);
  }
  .stat .label{font-size:11.5px;color:var(--ink-soft);letter-spacing:.03em;margin-bottom:6px;}
  .stat .value{font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif CJK JP",serif;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;}
  .stat.income .value{color:var(--income);}
  .stat.expense .value{color:var(--variable);}
  .stat.saving .value{color:var(--saving);}
  .stat.balance .value{color:var(--indigo-deep);}
  .charts{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;}
  .chart-box{position:relative;height:230px;}
  .breakdown{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px;}
  .legend-list{list-style:none;margin:10px 0 0;padding:0;font-size:13px;}
  .legend-list li{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line);}
  .legend-list li:last-child{border-bottom:none;}
  .legend-name{display:flex;align-items:center;gap:7px;color:var(--ink);}

  .hint{font-size:12px;color:var(--ink-soft);margin:-6px 0 14px;line-height:1.7;}
  .save-status{
    position:fixed;bottom:18px;right:18px;background:var(--indigo-deep);color:#fff;
    padding:8px 16px;border-radius:999px;font-size:12.5px;box-shadow:var(--shadow);
    opacity:0;transform:translateY(6px);transition:.25s;pointer-events:none;
    z-index:50;
  }
  .save-status.show{opacity:1;transform:none;}
  .save-status.error{background:var(--danger);max-width:calc(100% - 36px);border-radius:12px;line-height:1.6;}
  .warn-text{color:var(--danger) !important;}
  .migration-notice{
    background:#FBF6E9;border:1px solid #E9D9AE;border-radius:10px;padding:10px 12px;
    font-size:12.5px;line-height:1.7;color:var(--ink);margin:0 0 14px;
  }
  .migration-notice strong{display:block;color:#8A5E10;margin-bottom:2px;}
  [hidden]{display:none !important;}
  .btn-row{display:flex;gap:8px;margin-top:8px;}
  .btn-row .ghost-btn{flex:1;min-height:38px;}
  .danger-btn{color:var(--danger);border-color:#E7C3BE;}
  .member-list{list-style:none;margin:0;padding:0;font-size:13.5px;}
  .member-list li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);}
  .member-list li:last-child{border-bottom:none;}
  .member-name{min-width:0;word-break:break-all;}
  .me-tag{font-size:10.5px;background:var(--indigo-deep);color:#fff;border-radius:999px;padding:1px 8px;margin-left:8px;white-space:nowrap;}
  .cat-add-form{display:grid;grid-template-columns:120px 1fr auto;gap:10px;align-items:end;}
  .check-row{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--ink);margin:4px 0 12px;line-height:1.6;cursor:pointer;}
  .check-row input{width:auto;margin-top:3px;flex-shrink:0;}
  .budget-edit-area{margin-top:14px;}
  .budget-edit-area .field{margin-bottom:8px;}
  .month-budget-tag{font-family:inherit;font-size:11px;font-weight:500;background:#F6EED9;color:#8A5E10;border-radius:999px;padding:2px 9px;}
  .receipt-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .receipt-actions .add-btn{flex:2;min-width:220px;white-space:normal;}
  .receipt-actions .ghost-btn{flex:1;min-width:140px;min-height:44px;}
  .receipt-paste{margin-top:12px;}
  .receipt-paste textarea{
    width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:16px;
    font-family:inherit;background:#FCFAF4;color:var(--ink);box-sizing:border-box;resize:vertical;
  }
  .search-form{display:grid;grid-template-columns:1fr 140px 150px 150px auto;gap:10px;align-items:end;}
  .search-summary{font-size:13px;margin:16px 0 0;color:var(--ink-soft);}
  .search-summary strong{color:var(--ink);font-variant-numeric:tabular-nums;}
  .year-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft);margin:-4px 0 8px;}
  .year-legend span{display:inline-flex;align-items:center;gap:6px;}
  .year-chart{width:100%;}
  .year-table td.minus{color:var(--danger);}
  .year-table tr.is-current td{background:#F2F6FA;}
  .loading-screen{
    display:flex;align-items:center;justify-content:center;height:60vh;
    color:var(--ink-soft);font-size:14px;
  }
  .error-screen{
    max-width:440px;margin:60px auto;text-align:center;color:var(--ink);
    background:var(--paper-raised);border:1px solid var(--line);border-radius:14px;
    padding:32px 24px;box-shadow:var(--shadow);
  }
  .error-screen p{color:var(--ink-soft);font-size:13.5px;line-height:1.8;}
  .error-screen button{
    margin-top:10px;background:var(--indigo-deep);color:#fff;border:none;border-radius:8px;
    padding:9px 20px;font-size:13.5px;cursor:pointer;font-family:inherit;
  }

  /* Storage mode banner */
  .mode-banner{
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    background:var(--paper-raised);border:1px solid var(--line);border-radius:12px;
    padding:10px 14px;margin-bottom:18px;box-shadow:var(--shadow);
  }
  .mode-banner .mode-text{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft);}
  .mode-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .mode-dot.cloud{background:var(--income);}
  .mode-dot.local{background:var(--gold);}
  .mode-actions{display:flex;gap:8px;}
  .ghost-btn{
    background:var(--paper);border:1px solid var(--line);color:var(--indigo-deep);
    border-radius:8px;padding:6px 12px;font-size:12.5px;cursor:pointer;font-family:inherit;
    white-space:nowrap;
  }
  .ghost-btn:hover{background:#EFE7D4;}

  /* 接続切れの警告バナー（リアルタイム共有モードで、接続が一度切れた場合のみ表示） */
  .disconnect-banner{
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    background:#FBF0EC;border:1px solid var(--danger);border-radius:12px;
    padding:10px 14px;margin:-8px 0 18px;font-size:12.5px;color:var(--danger);
  }
  .disconnect-banner .ghost-btn{color:var(--danger);border-color:var(--danger);}

  @media (max-width:720px){
    .entry-form,.entry-form.with-cat{grid-template-columns:1fr 1fr;}
    .add-btn{grid-column:1/-1;}
    /* 日付欄はブラウザ標準のカレンダー部品を含み、他の項目と1行を分け合うと
       窮屈になりやすいため、2列レイアウトの間も常に1行を専有させる */
    .field-date{grid-column:1/-1;}
    .edit-form{grid-template-columns:1fr 1fr;}
    .edit-actions{grid-column:1/-1;}
    .edit-actions .add-btn,.edit-actions .ghost-btn{flex:1;}
    .search-form{grid-template-columns:1fr 1fr;}
    .search-form .search-q{grid-column:1/-1;}
    .search-form .field-date{grid-column:auto;}
    .stat-grid{grid-template-columns:1fr 1fr;}
    .charts,.breakdown{grid-template-columns:1fr;}
  }

  /* スマートフォン相当の幅（480px以下）では、入力欄を1列に積み上げて
     タップしやすい大きさを確保する。ブラウザの画面幅にあわせて
     自動的にこのレイアウトへ切り替わる（機種の判定ではなく画面幅で判定）。 */
  @media (max-width:480px){
    .wrap{padding:16px 12px 70px;}
    .app-header{flex-wrap:wrap;gap:10px;}
    .entry-form,.entry-form.with-cat{grid-template-columns:minmax(0,1fr);}
    .field{width:100%;min-width:0;max-width:100%;}
    .field-date{grid-column:1;width:100%;min-width:0;max-width:100%;}
    .field-date input[type="date"]{width:100%;min-width:0;max-width:100%;}
    .add-btn{grid-column:1;width:100%;}
    .stat-grid{grid-template-columns:1fr;}
    .card{padding:16px;}
    .month-nav{width:100%;justify-content:space-between;}
    .mode-banner{flex-direction:column;align-items:stretch;}
    .mode-actions{width:100%;}
    .ghost-btn{flex:1;}
    /* 編集フォームを開いている表は、横スクロールせずに画面幅へ収める */
    table.has-edit{min-width:0;}
    .edit-form{grid-template-columns:minmax(0,1fr);}
    .search-form{grid-template-columns:minmax(0,1fr);}
    .search-form .field-date{grid-column:1;}
    .cat-add-form{grid-template-columns:minmax(0,1fr);}
  }

  /* タッチ操作の端末（スマートフォン・タブレット）では、ボタンなどの
     タップ領域を少し広めに取る。JS側で <html> に is-touch クラスを
     付与して判定している（画面幅だけでなく入力方式でも判定するため）。 */
  .is-touch .add-btn,.is-touch .ghost-btn,.is-touch .tab-btn{min-height:40px;}
  .is-touch .del,.is-touch .edit{min-width:32px;min-height:32px;display:inline-flex;align-items:center;justify-content:center;}

  /* PDF出力ボタンを目立たせるためのカード枠（通常の画面表示用） */
  .print-card{border:1px dashed var(--indigo);background:#F2F6FA;}
  .print-card .add-btn:disabled{opacity:.6;cursor:default;}

  /* レシート読み取り機能 */
  .receipt-card{border:1px dashed var(--saving);background:#FBF6E9;}
  .receipt-card .add-btn:disabled{opacity:.6;cursor:default;}
  .receipt-review{
    margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);
  }
  .receipt-review .field{margin-bottom:10px;}
  .receipt-review-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
  .receipt-review-actions .add-btn,.receipt-review-actions .ghost-btn{flex:1;min-width:140px;}
  .receipt-ocr-raw{
    margin-top:12px;font-size:11.5px;color:var(--ink-soft);
  }
  .receipt-ocr-raw summary{cursor:pointer;}
  .receipt-ocr-raw pre{
    white-space:pre-wrap;word-break:break-word;background:#FCFAF4;
    border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:6px;
    max-height:160px;overflow-y:auto;
  }
  .receipt-preview{max-width:100%;max-height:220px;border-radius:8px;margin:10px 0;display:block;}

<!--
  夫婦間のリアルタイム共有（Firebase Realtime Database）用の設定。
  ここで使っているapiKey等は「アプリの居場所を示す識別子」であり、
  これ自体が漏れても即座に情報が読み書きされるわけではない
  （実際のアクセス制御はデータベース側の「ルール」で行っている）。
  このスクリプトが読み込めない場合（オフライン、通信制限など）は、
  window.firebaseSyncが設定されないため、アプリは自動的に
  この端末内保存（localStorage）に切り替わる。
-->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import { getDatabase, ref, set, remove, update, get, onValue } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";
  import {
    getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
    onAuthStateChanged, signOut,
    updateEmail as fbUpdateEmail, updatePassword as fbUpdatePassword
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

  // 接続先：2026年10月に作り直したFirebaseプロジェクト「kakeibo-2026」
  // （以前のプロジェクト our-household-budget-68d2a からは、書き出し・読み込みでデータを移す）
  const firebaseConfig = {
    apiKey: "AIzaSyDLPOehPqyRijGD9xaOsiOPBNCWFTm2v2E",
    authDomain: "kakeibo-2026-a6154.firebaseapp.com",
    databaseURL: "https://kakeibo-2026-a6154-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "kakeibo-2026-a6154",
    storageBucket: "kakeibo-2026-a6154.firebasestorage.app",
    messagingSenderId: "311998330986",
    appId: "1:311998330986:web:db0fb30f00ceda255ff213"
  };

  // 世帯（household）IDや通知トピック名に使う、推測されにくいランダムな文字列。
  // 暗号用の乱数（crypto.getRandomValues）が使えればそれを使う。
  function randomString(length, chars){
    const out = [];
    let arr = null;
    try{
      arr = new Uint32Array(length);
      window.crypto.getRandomValues(arr);
    }catch(e){ arr = null; }
    for(let i=0; i<length; i++){
      const r = arr ? arr[i] : Math.floor(Math.random() * 4294967296);
      out.push(chars.charAt(r % chars.length));
    }
    return out.join("");
  }
  function randomHouseholdId(){
    return randomString(24, "abcdefghijklmnopqrstuvwxyz0123456789");
  }
  // 招待コード。世帯IDとは別の値にしておき、漏れたときは作り直せるようにする。
  // 人が入力しやすいよう、紛らわしい文字（0/O、1/I/L）を除いた英大文字・数字12文字。
  function randomInviteCode(){
    return randomString(12, "ABCDEFGHJKMNPQRSTUVWXYZ23456789");
  }

  try{
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    window.firebaseSync = {
      configured: true,
      subscribe: function(householdId, onData, onError){
        try{
          const dbRef = ref(db, "households/" + householdId);
          onValue(dbRef, function(snapshot){
            onData(snapshot.val());
          }, function(err){
            if(onError) onError(err);
          });
        }catch(e){
          if(onError) onError(e);
        }
      },
      writeRecord: function(householdId, kind, id, recordWithoutId){
        return set(ref(db, "households/" + householdId + "/" + kind + "/" + id), recordWithoutId);
      },
      deleteRecord: function(householdId, kind, id){
        return remove(ref(db, "households/" + householdId + "/" + kind + "/" + id));
      },
      // 変動費のカテゴリー別予算（{カテゴリー名: 金額}の単純なオブジェクト）を
      // まるごと保存する。個々のレコードのような単位ではないため、
      // writeRecordとは別に専用の関数を用意している。
      setBudgets: function(householdId, budgets){
        return set(ref(db, "households/" + householdId + "/budgets"), budgets);
      },
      // Firebase専用の特別なパス「.info/connected」を購読すると、
      // 今まさにサーバーへ接続できているかどうかが分かる。
      // これを使って「今は最新の状態と繋がっているか」を画面に表示する。
      watchConnection: function(onChange){
        try{
          onValue(ref(db, ".info/connected"), function(snapshot){
            onChange(!!snapshot.val());
          });
        }catch(e){
          console.log("接続状態の監視に失敗しました:", e);
        }
      },
      // ---------- ここからログイン・世帯（household）管理 ----------
      auth: {
        register: function(email, password){
          return createUserWithEmailAndPassword(auth, email, password).then(function(cred){ return cred.user; });
        },
        login: function(email, password){
          return signInWithEmailAndPassword(auth, email, password).then(function(cred){ return cred.user; });
        },
        logout: function(){
          return signOut(auth);
        },
        onChange: function(cb){
          onAuthStateChanged(auth, cb);
        },
        updateEmailAddress: function(newEmail){
          return fbUpdateEmail(auth.currentUser, newEmail);
        },
        updatePasswordValue: function(newPassword){
          return fbUpdatePassword(auth.currentUser, newPassword);
        }
      },
      // ログイン中のユーザーが、すでにどの世帯（household）に所属しているかを調べる
      getUserHousehold: function(uid){
        return get(ref(db, "users/" + uid + "/householdId")).then(function(snap){
          return snap.exists() ? snap.val() : null;
        });
      },
      // 新しい世帯を作り、自分をその最初のメンバーとして登録する。
      // データベースのルール上、メンバーが1人もいない世帯にだけ「最初のメンバー」として
      // 登録できるため、先にメンバー登録を済ませる（招待コード等は起動後に用意する）。
      createHousehold: function(uid){
        const id = randomHouseholdId();
        return set(ref(db, "households/" + id + "/members/" + uid), true).then(function(){
          return set(ref(db, "users/" + uid + "/householdId"), id);
        }).then(function(){ return id; });
      },
      // 招待コードを使って既存の世帯に参加する。招待コードは世帯IDとは別の値で、
      // invites/{招待コード} にその世帯のIDが入っている。メンバー登録の値として
      // 招待コードを書き込み、ルール側で「現在の招待コードと一致するか」を確かめる。
      joinHousehold: function(uid, code){
        return get(ref(db, "invites/" + code)).then(function(snap){
          if(!snap.exists()){ throw new Error("invite-not-found"); }
          const householdId = snap.val();
          return set(ref(db, "households/" + householdId + "/members/" + uid), code).then(function(){
            return set(ref(db, "users/" + uid + "/householdId"), householdId);
          }).then(function(){ return householdId; });
        });
      },
      // データベースのルールが新しい版（招待コード等に対応した firebase_rules_v2.json）に
      // 更新済みかを調べる。新しいルールでは invites/ の1件を読めるが、古いルールでは
      // 権限エラーになる。判定できない場合（通信エラー等）は「古いルール」として扱う。
      probeRulesV2: function(){
        return get(ref(db, "invites/__probe__")).then(function(){ return true; }, function(){ return false; });
      },
      // 古いルールのデータベースでの参加方法（世帯IDを直接入力する）
      joinHouseholdLegacy: function(uid, householdId){
        return set(ref(db, "households/" + householdId + "/members/" + uid), true).then(function(){
          return set(ref(db, "users/" + uid + "/householdId"), householdId);
        }).then(function(){ return householdId; });
      },
      // 招待コード・自分のメンバー情報（メールアドレス）が
      // まだ無い世帯（以前のバージョンで作った世帯など）に、それらを用意する。
      // 通知トピック名は自動では作らない（作り直したときだけ保存する。17.1節）。
      setupHouseholdMeta: function(householdId, uid, email, meta){
        let chain = Promise.resolve();
        if(!meta.inviteCode){
          const code = randomInviteCode();
          chain = chain.then(function(){
            return set(ref(db, "invites/" + code), householdId);
          }).then(function(){
            return set(ref(db, "households/" + householdId + "/inviteCode"), code);
          });
        }
        if(!meta.hasMyInfo && email){
          chain = chain.then(function(){
            return set(ref(db, "households/" + householdId + "/memberInfo/" + uid), { email: email });
          });
        }
        return chain;
      },
      // 招待コードを作り直す。新しいコードを登録してから、古いコードを無効にする。
      regenerateInviteCode: function(householdId, oldCode){
        const code = randomInviteCode();
        return set(ref(db, "invites/" + code), householdId).then(function(){
          return set(ref(db, "households/" + householdId + "/inviteCode"), code);
        }).then(function(){
          if(oldCode){
            return remove(ref(db, "invites/" + oldCode)).catch(function(e){
              console.log("古い招待コードの削除に失敗しました:", e);
            });
          }
        }).then(function(){ return code; });
      },
      regenerateNotifyTopic: function(householdId){
        const topic = "kakeibo-" + randomHouseholdId();
        return set(ref(db, "households/" + householdId + "/notifyTopic"), topic).then(function(){ return topic; });
      },
      // ほかのメンバーをこの世帯から外す
      removeMember: function(householdId, uid){
        return remove(ref(db, "households/" + householdId + "/memberInfo/" + uid)).then(function(){
          return remove(ref(db, "households/" + householdId + "/members/" + uid));
        });
      },
      // 自分がこの世帯から抜ける。最後の1人の場合は、世帯のデータをすべて消してから抜ける
      // （メンバーが0人の世帯は、世帯IDを知っている人が「最初のメンバー」として
      //   登録できてしまうため、データを残さないようにしている）。
      leaveHousehold: function(householdId, uid, isLastMember, inviteCode){
        // 古いルールのデータベースには存在しない場所（memberInfo等）は、
        // 削除が拒否されても先へ進む（ignore）。記録データとメンバー登録の削除は必須。
        const ignore = function(){};
        let chain = Promise.resolve();
        if(isLastMember){
          ["incomes","expenses","savings","budgets"].forEach(function(p){
            chain = chain.then(function(){ return remove(ref(db, "households/" + householdId + "/" + p)); });
          });
          ["budgetsByMonth","settings","notifyTopic","inviteCode"].forEach(function(p){
            chain = chain.then(function(){ return remove(ref(db, "households/" + householdId + "/" + p)).catch(ignore); });
          });
          if(inviteCode){
            chain = chain.then(function(){ return remove(ref(db, "invites/" + inviteCode)).catch(ignore); });
          }
        }
        return chain.then(function(){
          return remove(ref(db, "households/" + householdId + "/memberInfo/" + uid)).catch(ignore);
        }).then(function(){
          return remove(ref(db, "households/" + householdId + "/members/" + uid));
        }).then(function(){
          return remove(ref(db, "users/" + uid + "/householdId"));
        });
      },
      // 世帯から外された場合などに、自分の「所属世帯」の記録だけを消す
      clearUserHousehold: function(uid){
        return remove(ref(db, "users/" + uid + "/householdId"));
      },
      // 世帯のデータの一部（予算・月別予算・カテゴリー設定・個々の記録など）を
      // 書き換える。value に null を渡すと、そのパスを削除する。
      writeHouseholdPath: function(householdId, path, value){
        const r = ref(db, "households/" + householdId + "/" + path);
        return (value === null || value === undefined) ? remove(r) : set(r, value);
      }
    };
  }catch(e){
    console.log("Firebaseの初期化に失敗したため、リアルタイム共有は無効になります（この端末内保存に切り替わります）:", e);
    window.firebaseSync = { configured: false };
  }
</script>

    {key:"ideco", label:"iDeCo", color:"#8F6E22"}
  ];

  const STORAGE_KEY = "budget-data-v1";
  // ログイン・世帯（household）の参加状況に応じて、実行時に決まる値。
  // ログイン前や世帯未参加の間は null のまま。
  // ※以前はログイン機能を追加する前の世帯IDをここに書き、画面にも表示していたが、
  //   公開リポジトリから誰でも読めてしまうため削除した。現在は世帯IDとは別の
  //   「招待コード」でのみ参加できる（設計書 13.3節）。
  let HOUSEHOLD_ID = null;
  let currentUser = null;
  // 世帯の付帯情報（招待コード・通知トピック名・メンバー一覧）。リアルタイム共有中のみ使う。
  let householdMeta = { inviteCode: null, notifyTopic: null, members: {}, memberInfo: {} };
  let householdMetaFailed = false;
  // データベースのルールが新しい版か（ログイン時に調べる）。古いルールのままでも、
  // 記録・編集・検索などはすべて使え、招待コードの作り直し・メンバーを外す・
  // カテゴリー追加・月ごとの予算だけが「ルール更新後に使える」表示になる。
  let rulesV2 = false;
  // 通知トピック名（作り直していない世帯では、世帯IDから計算した値を使う）
  let hashTopic = null;
  // 世帯ごとの設定（カテゴリー追加・月ごとの予算）を保存できるか。
  // ログインしていない場合（端末内保存）や、新しいルールの場合は使える。
  function canUseHouseholdSettings(){
    return !HOUSEHOLD_ID || rulesV2;
  }
  // 通知トピック名。世帯IDそのものを使うと、トピック名から世帯IDが分かってしまうため、
  // 世帯IDのハッシュ値（SHA-256）から作る。データベースへの書き込みが不要なので、
  // 古いルールのままでも使える。
  function computeHashTopic(){
    hashTopic = null;
    if(!HOUSEHOLD_ID || !(window.crypto && window.crypto.subtle && window.TextEncoder)) return Promise.resolve();
    return window.crypto.subtle.digest("SHA-256", new TextEncoder().encode("kakeibo-topic:" + HOUSEHOLD_ID)).then(function(buf){
      const bytes = new Uint8Array(buf);
      let hex = "";
      for(let i=0; i<12; i++){ hex += ("0" + bytes[i].toString(16)).slice(-2); }
      hashTopic = "kakeibo-" + hex;
    }).catch(function(e){ console.log("通知トピック名を作れませんでした:", e); });
  }
  function currentNotifyTopic(){
    return (householdMeta && householdMeta.notifyTopic) || hashTopic;
  }
  const el = id => document.getElementById(id);
  const yen = n => "¥" + Math.round(n).toLocaleString("ja-JP");
  // 一部の古いブラウザ・組み込みブラウザでは NodeList.forEach が使えないため、
  // 互換性の高い方法でループを回す小さなヘルパー。
  function each(nodeList, fn){
    for(let i=0; i<nodeList.length; i++){ fn(nodeList[i], i); }
  }
  // 端末の現地時刻での日付（YYYY-MM-DD）。以前は toISOString()（世界標準時）を
  // 使っていたため、日本時間の 0:00〜8:59 は前日の日付になっていた。
  function localDateStr(d){
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
  const todayStr = () => localDateStr(new Date());
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

  let data = { incomes: [], expenses: [], savings: [], budgets: {}, budgetsByMonth: {}, settings: {} };
  let currentMonth = todayStr().slice(0,7); // YYYY-MM
  let activeTab = "income";

  let currentPage = "main";
  let menuOpen = false;
  // 編集中の記録。同時に開ける編集フォームは1件だけにして、画面を分かりやすく保つ。
  // 例：{kind:"expenses", id:"lx3k..."}。編集していないときは null。
  let editing = null;
  // storageMode: "cloud"    = Claudeアーティファクトの共有ストレージ
  //              "realtime" = Firebase Realtime Databaseでの即時共有
  //              "local"    = この端末のブラウザ内保存のみ
  let storageMode = "local";
  // ログインしているのに共有サーバーへつながらず、一時的に端末内保存になっている状態。
  // この間の操作は「未送信」として控えておき、つながった時点で自動的に送る。
  let realtimeFallback = false;

  // 読み込んだ記録のうち、日付・金額が壊れているものを取り除く
  // （1件でも想定外のデータがあると画面全体が表示できなくなるのを防ぐ）。
  function cleanRecords(list){
    if(!Array.isArray(list)) return [];
    return list.filter(function(x){
      return x && typeof x === "object" && typeof x.date === "string" && x.date.length >= 10
        && typeof x.amount === "number" && isFinite(x.amount) && x.id;
    }).map(function(x){
      if(typeof x.category !== "string") x.category = String(x.category == null ? "" : x.category);
      if(x.memo != null && typeof x.memo !== "string") x.memo = String(x.memo);
      return x;
    });
  }
  function plainObject(v){ return (v && typeof v === "object" && !Array.isArray(v)) ? v : {}; }

  function applyParsed(parsed){
    data.incomes = cleanRecords(parsed && parsed.incomes);
    data.expenses = cleanRecords(parsed && parsed.expenses);
    data.savings = cleanRecords(parsed && parsed.savings);
    data.budgets = plainObject(parsed && parsed.budgets);
    data.budgetsByMonth = plainObject(parsed && parsed.budgetsByMonth);
    data.settings = plainObject(parsed && parsed.settings);
  }

  function objectToArray(obj){
    if(!obj || typeof obj !== "object") return [];
    return Object.keys(obj).map(function(id){
      const rec = Object.assign({}, obj[id]);
      rec.id = id;
      return rec;
    });
  }

  function applyFirebaseSnapshot(val){
    data.incomes = cleanRecords(objectToArray(val && val.incomes));
    data.expenses = cleanRecords(objectToArray(val && val.expenses));
    data.savings = cleanRecords(objectToArray(val && val.savings));
    data.budgets = plainObject(val && val.budgets);
    data.budgetsByMonth = plainObject(val && val.budgetsByMonth);
    data.settings = plainObject(val && val.settings);
    householdMeta = {
      inviteCode: (val && val.inviteCode) || null,
      notifyTopic: (val && val.notifyTopic) || null,
      members: plainObject(val && val.members),
      memberInfo: plainObject(val && val.memberInfo)
    };
    // つながらなくなったときに直前の内容を表示できるよう、端末にも控えておく
    try{ localStorage.setItem(cacheKey(), JSON.stringify(data)); }catch(e){}
  }

  // ---------- 共有サーバーにつながらない間の、端末内の控え ----------
  function cacheKey(){ return "budget-cache-" + HOUSEHOLD_ID; }
  function pendingKey(){ return "budget-pending-" + HOUSEHOLD_ID; }
  function readPending(){
    try{
      const raw = localStorage.getItem(pendingKey());
      const list = raw ? JSON.parse(raw) : [];
      return Array.isArray(list) ? list : [];
    }catch(e){ return []; }
  }
  // 未送信の操作を1件控える。path は世帯の中の場所（例："expenses/abc"）、
  // value は書き込む内容（null なら削除）。
  function queuePending(path, value){
    if(!realtimeFallback || !HOUSEHOLD_ID) return;
    const list = readPending();
    list.push({ path: path, value: (value === undefined ? null : value) });
    try{ localStorage.setItem(pendingKey(), JSON.stringify(list)); }catch(e){
      console.error("未送信の操作を控えられませんでした:", e);
    }
  }
  // 控えておいた操作を、古い順に1件ずつ共有サーバーへ送る。送った件数を返す。
  function flushPending(){
    const list = readPending();
    if(!list.length || !(window.firebaseSync && window.firebaseSync.writeHouseholdPath)) return Promise.resolve(0);
    let sent = 0;
    let chain = Promise.resolve();
    list.forEach(function(item){
      chain = chain.then(function(){
        return window.firebaseSync.writeHouseholdPath(HOUSEHOLD_ID, item.path, item.value).then(function(){ sent++; });
      });
    });
    return chain.then(function(){
      try{ localStorage.removeItem(pendingKey()); }catch(e){}
      return sent;
    }).catch(function(e){
      console.error("未送信の操作の一部を送れませんでした:", e);
      // 送れた分だけ控えから取り除く
      try{ localStorage.setItem(pendingKey(), JSON.stringify(list.slice(sent))); }catch(e2){}
      showError("端末に控えていた記録の一部を共有できませんでした。再読み込みしてお試しください。");
      return sent;
    });
  }

  // 注意：このアプリはスマートフォンの標準ブラウザや、機種・アプリ内ブラウザの違いによる
  // 互換性の問題を避けるため、意図的に async/await を使わず Promise の .then()/.catch() で
  // 非同期処理を記述している（一部の組み込みブラウザでは async 構文の解釈に失敗することがあるため）。
  // fromRealtime=true：ログイン中に共有サーバーへつながらなかった場合。直前に共有から
  // 受け取った内容（端末内の控え）を表示し、以降の操作を「未送信」として控える。
  function loadLocalFallback(fromRealtime){
    storageMode = "local";
    realtimeFallback = !!(fromRealtime && HOUSEHOLD_ID);
    try{
      const raw = localStorage.getItem(realtimeFallback ? cacheKey() : STORAGE_KEY);
      if(raw) applyParsed(JSON.parse(raw));
    }catch(e){
      console.log("この端末内保存も利用できません:", e);
    }
  }

  function isPermissionError(err){
    return !!err && /permission/i.test(String(err.code || "") + " " + String(err.message || ""));
  }

  // 世帯から外された（または世帯がなくなった）ときの処理。
  // 所属世帯の記録を消して再読み込みし、招待コードの入力画面に戻す。
  let leavingHousehold = false; // 自分で「抜ける」を押したときは、権限がなくなっても警告を出さない
  function handleLostHouseholdAccess(){
    if(leavingHousehold) return;
    alert("この家計を表示する権限がありません（メンバーから外された可能性があります）。招待コードを入力して参加し直してください。");
    const done = function(){ location.reload(); };
    if(currentUser && window.firebaseSync && window.firebaseSync.clearUserHousehold){
      window.firebaseSync.clearUserHousehold(currentUser.uid).then(done, done);
    }else{
      done();
    }
  }

  // Firebaseが設定されていればリアルタイム共有を試み、ダメなら端末内保存に切り替える。
  function tryRealtimeThenLocal(resolve){
    if(!(window.firebaseSync && window.firebaseSync.configured)){
      loadLocalFallback(false);
      resolve();
      return;
    }
    let settled = false;
    const timeoutId = setTimeout(function(){
      if(settled) return;
      settled = true;
      console.log("リアルタイム共有への接続がタイムアウトしたため、一時的にこの端末内保存に切り替えます");
      loadLocalFallback(true);
      resolve();
    }, 10000);

    window.firebaseSync.subscribe(HOUSEHOLD_ID, function(val){
      if(!settled){
        settled = true;
        clearTimeout(timeoutId);
        storageMode = "realtime";
        applyFirebaseSnapshot(val);
        startConnectionWatch();
        maybeSetupHouseholdMeta();
        resolve();
        return;
      }
      if(storageMode === "local" && realtimeFallback){
        // 起動時にはつながらなかったが、あとから共有サーバーにつながった場合。
        // 端末に控えておいた操作を送ってから、共有の内容に切り替える。
        storageMode = "realtime";
        realtimeFallback = false;
        applyFirebaseSnapshot(val);
        startConnectionWatch();
        maybeSetupHouseholdMeta();
        render();
        renderTabs();
        flushPending().then(function(sent){
          if(sent > 0) flashSaved("端末に控えていた" + sent + "件を共有しました");
        });
        return;
      }
      // 2回目以降の呼び出し＝自分または相手の端末での変更がリアルタイムに届いたもの
      applyFirebaseSnapshot(val);
      render();
      renderTabs();
    }, function(err){
      if(settled){
        // 表示中に読み取り権限がなくなった（メンバーから外された等）
        if(isPermissionError(err)) handleLostHouseholdAccess();
        return;
      }
      settled = true;
      clearTimeout(timeoutId);
      if(isPermissionError(err) && currentUser){
        handleLostHouseholdAccess();
        return;
      }
      console.log("リアルタイム共有への接続に失敗したため、一時的にこの端末内保存に切り替えます:", err);
      loadLocalFallback(true);
      resolve();
    });
  }

  // 以前のバージョンで作った世帯には、招待コード・通知トピック名・メンバーの
  // メールアドレスが無いため、起動時に自動で用意する。
  function maybeSetupHouseholdMeta(){
    if(!rulesV2 || !(window.firebaseSync && window.firebaseSync.setupHouseholdMeta) || !currentUser || !HOUSEHOLD_ID) return;
    const myInfo = householdMeta.memberInfo && householdMeta.memberInfo[currentUser.uid];
    const hasMyInfo = !!(myInfo && myInfo.email === currentUser.email);
    if(householdMeta.inviteCode && hasMyInfo) return;
    window.firebaseSync.setupHouseholdMeta(HOUSEHOLD_ID, currentUser.uid, currentUser.email, {
      inviteCode: householdMeta.inviteCode,
      notifyTopic: householdMeta.notifyTopic,
      hasMyInfo: hasMyInfo
    }).then(function(){
      householdMetaFailed = false;
    }).catch(function(e){
      // Firebaseのルールが古いままだと、招待コード等を書き込めない
      console.error("招待コード等の準備に失敗しました（Firebaseのルールが古い可能性があります）:", e);
      householdMetaFailed = true;
      if(currentPage === "mypage") renderMyPage();
    });
  }

  // 接続状態の監視（「相手の更新が届いているか」をユーザーが確認できるようにする）。
  // 初回接続後に一度でも接続が切れたら、connectionLost=true にして再読み込みを促す。
  // 切断直後の一瞬の揺らぎで警告が出ないよう、少し待ってから判定する。
  let connectionLost = false;
  let hasConnectedOnce = false;
  let connectionWatchStarted = false;
  function startConnectionWatch(){
    if(connectionWatchStarted) return;
    if(!(window.firebaseSync && window.firebaseSync.watchConnection)) return;
    connectionWatchStarted = true;
    window.firebaseSync.watchConnection(function(isConnected){
      if(isConnected){
        hasConnectedOnce = true;
        if(connectionLost){
          connectionLost = false;
          render();
          renderTabs();
        }
      }else if(hasConnectedOnce){
        connectionLost = true;
        render();
        renderTabs();
      }
    });
  }

  function loadData(){
    return new Promise(function(resolve){
      // 1) Claudeのアーティファクト上で動作している場合は共有ストレージを試す
      if(typeof window.storage !== "undefined" && window.storage && typeof window.storage.get === "function"){
        window.storage.get(STORAGE_KEY, true).then(function(res){
          storageMode = "cloud";
          if(res && res.value) applyParsed(JSON.parse(res.value));
          resolve();
        }).catch(function(e){
          console.log("共有ストレージが利用できないため、他の保存方法を試します:", e);
          tryRealtimeThenLocal(resolve);
        });
        return;
      }
      // 2) Firebaseが設定されていればリアルタイム共有、なければ端末内保存(localStorage)
      tryRealtimeThenLocal(resolve);
    });
  }

  // 一括保存（共有ストレージ／端末内保存の両モードで使用。
  // realtimeモードはレコード単位で保存するため saveData() は使わない）
  function saveData(){
    const json = JSON.stringify(data);
    function saveLocal(){
      try{
        localStorage.setItem(realtimeFallback ? cacheKey() : STORAGE_KEY, json);
        flashSaved();
      }catch(e){
        console.error("保存エラー:", e);
        showError("この端末に保存できませんでした。ブラウザの設定（プライベートモード等）をご確認ください。");
      }
    }
    if(storageMode === "cloud"){
      try{
        return window.storage.set(STORAGE_KEY, json, true).then(function(result){
          if(!result) throw new Error("empty result");
          flashSaved();
        }).catch(function(e){
          console.error("共有保存に失敗したため、この端末内保存に切り替えます:", e);
          storageMode = "local";
          saveLocal();
        });
      }catch(e){
        console.error("共有保存の呼び出しに失敗したため、この端末内保存に切り替えます:", e);
        storageMode = "local";
      }
    }
    saveLocal();
    return Promise.resolve();
  }

  function kindLabel(kind){
    if(kind === "incomes") return "収入";
    if(kind === "expenses") return "支出";
    if(kind === "savings") return "貯金・資産形成";
    return kind;
  }

  // スマートフォンへの通知（ntfy.sh、無料・登録不要のプッシュ通知サービス）。
  // ntfy.sh のトピックは名前を知っていれば誰でも購読できるため、
  // (1) トピック名は世帯ID・招待コードとは別のランダムな値にし、
  // (2) 通知の本文には金額・メモなどの家計の中身を載せない。
  // 送信に失敗してもアプリの他の機能には一切影響しない（あくまで補助的な機能のため）。
  function sendNtfyNotification(kind, action){
    const topic = currentNotifyTopic();
    if(!topic) return;
    try{
      fetch("https://ntfy.sh/", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ topic: topic, title: "ふたり家計簿", message: kindLabel(kind) + "の記録が1件" + action + "されました" })
      }).catch(function(e){
        console.log("通知の送信に失敗しました（アプリの動作には影響しません）:", e);
      });
    }catch(e){
      console.log("通知の送信に失敗しました（アプリの動作には影響しません）:", e);
    }
  }

  // ---------- 保存（1件ずつ） ----------
  // realtimeモード：Firebaseの該当パスだけを書き換える。サーバーに拒否された場合
  // （権限がない・データの形が正しくない等）は、その旨を画面にはっきり表示する。
  // 以前は失敗すると黙って「この端末内保存」に切り替わり、以降の記録が相手に
  // 共有されないまま気づきにくかったため、切り替えないようにした。
  function realtimeWriteFailed(e){
    console.error("共有データへの保存に失敗しました:", e);
    showError(isPermissionError(e)
      ? "保存できませんでした（権限がないか、入力内容の形式が正しくありません）。再読み込みしてからもう一度お試しください。"
      : "保存できませんでした。通信環境を確認して、もう一度お試しください。");
  }

  function recordWithoutId(record){
    const clone = Object.assign({}, record);
    delete clone.id;
    return clone;
  }

  function persistAdd(kind, record){
    if(storageMode === "realtime"){
      return window.firebaseSync.writeHouseholdPath(HOUSEHOLD_ID, kind + "/" + record.id, recordWithoutId(record)).then(function(){
        flashSaved();
        sendNtfyNotification(kind, "追加");
      }).catch(realtimeWriteFailed);
    }
    data[kind].push(record);
    queuePending(kind + "/" + record.id, recordWithoutId(record));
    return saveData();
  }

  function persistDelete(kind, id){
    if(storageMode === "realtime"){
      return window.firebaseSync.writeHouseholdPath(HOUSEHOLD_ID, kind + "/" + id, null).then(function(){
        flashSaved();
        sendNtfyNotification(kind, "削除");
      }).catch(realtimeWriteFailed);
    }
    data[kind] = data[kind].filter(function(x){ return x.id !== id; });
    queuePending(kind + "/" + id, null);
    return saveData();
  }

  // 既存の記録1件の内容（日付・区分・メモ・金額）を書き換える。
  // realtimeモードでは同じIDのパスに上書き保存するだけなので、相手の端末にも
  // 追加・削除と同じ仕組みで即座に反映される。記録者（addedBy）は元のまま残す。
  function persistUpdate(kind, id, changes){
    let idx = -1;
    for(let i=0; i<data[kind].length; i++){
      if(data[kind][i].id === id){ idx = i; break; }
    }
    if(idx < 0) return Promise.resolve();
    const updated = Object.assign({}, data[kind][idx], changes);
    if(storageMode === "realtime"){
      return window.firebaseSync.writeHouseholdPath(HOUSEHOLD_ID, kind + "/" + id, recordWithoutId(updated)).then(function(){
        flashSaved();
        sendNtfyNotification(kind, "修正");
      }).catch(realtimeWriteFailed);
    }
    data[kind][idx] = updated;
    queuePending(kind + "/" + id, recordWithoutId(updated));
    return saveData();
  }

  // 予算・カテゴリー設定など、記録以外のデータを保存する共通処理。
  function persistPath(path, value){
    if(storageMode === "realtime"){
      return window.firebaseSync.writeHouseholdPath(HOUSEHOLD_ID, path, value).then(function(){
        flashSaved();
      }).catch(realtimeWriteFailed);
    }
    queuePending(path, value);
    return saveData();
  }

  // レコード（収入・支出・貯金）に共通の項目を組み立てる。
  // ログイン中であれば、「誰が記録したか」を一緒に保存しておく（addedBy）。
  // ログインしていない場合は付与しない。
  function buildRecordBase(fields){
    const record = Object.assign({ id: uid() }, fields);
    if((storageMode === "realtime" || realtimeFallback) && currentUser && currentUser.email){
      record.addedBy = currentUser.email;
    }
    return record;
  }

  // 一覧表に表示する「記録した人」の小さなラベル。メールアドレスの
  // @より前の部分だけを表示し、addedByが無い場合は何も表示しない。
  function addedByTag(record){
    if(!record || !record.addedBy) return "";
    return `<br><span class="added-by-tag">${escapeHtml(String(record.addedBy).split("@")[0])}</span>`;
  }

  // 変動費のカテゴリー別予算。基本は「毎月共通の目安」（budgets）を1つ持ち、
  // 特定の月だけ別の予算にしたい場合は budgetsByMonth[YYYY-MM] に保存する。
  // その月の個別予算があればそちらを優先する。
  function effectiveBudgets(month){
    const bm = data.budgetsByMonth && data.budgetsByMonth[month];
    if(bm && typeof bm === "object") return bm;
    return data.budgets || {};
  }
  function hasMonthBudget(month){
    return !!(data.budgetsByMonth && data.budgetsByMonth[month] && typeof data.budgetsByMonth[month] === "object");
  }
  // month を渡すとその月だけの予算、渡さなければ毎月共通の予算として保存する。
  // budgets に null を渡すと、その月の個別予算を削除して共通の予算に戻す。
  function persistBudgets(budgets, month){
    if(month){
      if(!data.budgetsByMonth) data.budgetsByMonth = {};
      if(budgets && Object.keys(budgets).length){
        data.budgetsByMonth[month] = budgets;
      }else{
        delete data.budgetsByMonth[month];
        budgets = null;
      }
      return persistPath("budgetsByMonth/" + month, budgets);
    }
    data.budgets = budgets || {};
    return persistPath("budgets", Object.keys(data.budgets).length ? data.budgets : null);
  }

  // カテゴリーの追加など、世帯ごとの設定
  function persistSettings(settings){
    data.settings = settings;
    return persistPath("settings", settings);
  }


  // ---------- Export / Import (端末間でデータをまとめる) ----------
  function downloadBlob(blob, filename){
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  function exportData(){
    const stamp = todayStr().replace(/-/g,"");
    downloadBlob(new Blob([JSON.stringify(data, null, 2)], {type:"application/json"}), `household-budget-${stamp}.json`);
  }

  // ---------- 区分・カテゴリーの共通処理 ----------
  // 支出カテゴリーは、あらかじめ用意したもの（FIXED_CATS・VARIABLE_CATS）に、
  // マイページから追加したもの（data.settings.extraCats）を足して使う。
  const EXTRA_CAT_COLORS = ["#6B7F99","#7C6A92","#5E8C88","#93785A","#8A6F7D","#6E8B5B","#A0715E","#5B7290"];
  function extraCatNames(type){
    const ec = data.settings && data.settings.extraCats;
    let list = ec && ec[type];
    if(list && !Array.isArray(list) && typeof list === "object"){
      list = Object.keys(list).map(function(k){ return list[k]; });
    }
    if(!Array.isArray(list)) return [];
    return list.filter(function(n){ return typeof n === "string" && n.trim(); });
  }
  function withExtraCats(base, type){
    const extras = extraCatNames(type).filter(function(n){
      return !base.some(function(c){ return c.key === n; });
    }).map(function(n, i){
      return { key: n, color: EXTRA_CAT_COLORS[i % EXTRA_CAT_COLORS.length], custom: true };
    });
    return base.concat(extras);
  }
  function fixedCats(){ return withExtraCats(FIXED_CATS, "fixed"); }
  function variableCats(){ return withExtraCats(VARIABLE_CATS, "variable"); }
  function expenseCats(type){ return type === "fixed" ? fixedCats() : variableCats(); }

  // 区分の表示名と色。一覧にない区分（読み込んだデータや、削除したカテゴリー）でも
  // 画面が止まらないよう、そのままの名前と灰色で表示する。
  function catInfo(kind, rec){
    let list;
    if(kind === "incomes") list = INCOME_CATS;
    else if(kind === "savings") list = SAVING_CATS;
    else list = expenseCats(rec.type);
    for(let i=0; i<list.length; i++){
      if(list[i].key === rec.category) return { key: list[i].key, label: list[i].label || list[i].key, color: list[i].color };
    }
    return { key: rec.category, label: rec.category || "（区分なし）", color: "#9AA1A8" };
  }
  function kindTypeLabel(kind, rec){
    if(kind === "incomes") return "収入";
    if(kind === "savings") return "貯金・資産形成";
    return rec.type === "fixed" ? "固定費" : "変動費";
  }
  // 収入・支出・貯金をまとめた一覧（検索・CSV出力で使う）
  function allRecordsForList(){
    const out = [];
    ["incomes","expenses","savings"].forEach(function(kind){
      data[kind].forEach(function(rec){
        const ci = catInfo(kind, rec);
        out.push({ kind: kind, rec: rec, typeLabel: kindTypeLabel(kind, rec), catLabel: ci.label, color: ci.color });
      });
    });
    out.sort(function(a, b){ return b.rec.date.localeCompare(a.rec.date); });
    return out;
  }

  // ---------- 金額の入力（足し算に対応） ----------
  // 「1200+850」のような入力を合計して返す。全角数字・カンマ・「¥」「円」も受け付ける。
  // 正しく読めない場合や0以下の場合は NaN を返す。
  function toHalfWidth(str){
    return String(str).replace(/[！-～]/g, function(ch){
      return String.fromCharCode(ch.charCodeAt(0) - 0xFEE0);
    }).replace(/　/g, " ");
  }
  function parseAmount(str){
    if(str == null) return NaN;
    let t = toHalfWidth(str).replace(/[\s,¥￥円]/g, "").replace(/[ー−–]/g, "-");
    if(!t) return NaN;
    if(!/^[0-9.+\-]+$/.test(t)) return NaN;
    if(/^[+\-]/.test(t) === false) t = "+" + t;
    const terms = t.match(/[+\-][0-9.]+/g);
    if(!terms || terms.join("") !== t) return NaN;
    let total = 0;
    for(let i=0; i<terms.length; i++){
      const v = parseFloat(terms[i]);
      if(!isFinite(v)) return NaN;
      total += v;
    }
    total = Math.round(total * 100) / 100;
    return total > 0 ? total : NaN;
  }

  // 同じ日・同じお店（メモ）・同じカテゴリーの支出がすでにあれば、
  // 1件にまとめる（金額を足す）か、別の記録として追加するかを選べるようにする。
  function findSameExpense(record){
    if(!record.memo) return null;
    for(let i=0; i<data.expenses.length; i++){
      const x = data.expenses[i];
      if(x.date === record.date && x.type === record.type && x.category === record.category && (x.memo || "") === record.memo){
        return x;
      }
    }
    return null;
  }
  function addExpenseOrMerge(record){
    const same = findSameExpense(record);
    if(same && confirm(
      record.date + " の「" + record.memo + "」（" + record.category + "）は、すでに " + yen(same.amount) + " で記録されています。\n\n" +
      "OK：金額を足して1件にまとめる（合計 " + yen(same.amount + record.amount) + "）\n" +
      "キャンセル：別の記録として追加する"
    )){
      return persistUpdate("expenses", same.id, { amount: Math.round((same.amount + record.amount) * 100) / 100 });
    }
    return persistAdd("expenses", record);
  }

  // ---------- CSV出力（Excel等で開く用） ----------
  function csvCell(v, isText){
    let s = String(v == null ? "" : v);
    // 「=」などで始まる文字列は、Excelで数式として実行されないよう先頭に ' を付ける
    if(isText && /^[=+\-@\t\r]/.test(s)) s = "'" + s;
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function exportCsv(){
    const lines = [["日付","種類","区分・カテゴリー","メモ","金額","記録者"].join(",")];
    allRecordsForList().slice().reverse().forEach(function(r){
      lines.push([
        csvCell(r.rec.date), csvCell(r.typeLabel), csvCell(r.catLabel, true),
        csvCell(r.rec.memo || "", true), csvCell(r.rec.amount), csvCell(r.rec.addedBy ? String(r.rec.addedBy).split("@")[0] : "", true)
      ].join(","));
    });
    const stamp = todayStr().replace(/-/g,"");
    // 先頭のBOM（\uFEFF）は、ExcelでUTF-8の日本語を文字化けさせずに開くため
    downloadBlob(new Blob(["\uFEFF" + lines.join("\r\n")], {type:"text/csv"}), `household-budget-${stamp}.csv`);
  }

  // html2canvas・jsPDF（いずれもブラウザで完結するPDF作成用の定番ライブラリ）を
  // 初回のPDF出力時にだけ、CDNから読み込む。日本語フォントをPDFに埋め込む処理は
  // 複雑なため、レポートの見た目を一度画像として描画し、その画像をPDFに貼り付ける
  // 方式にすることで、日本語もそのまま綺麗に出力できるようにしている。
  const PDF_LIB_URLS = [
    "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js",
    "https://cdnjs.cloudflare.com/ajax/libs/jspdf/4.2.1/jspdf.umd.min.js"
  ];
  let pdfLibsPromise = null;

  function loadScriptOnce(src){
    return new Promise(function(resolve, reject){
      const existing = document.querySelector('script[data-pdf-lib="' + src + '"]');
      if(existing){ resolve(); return; }
      const s = document.createElement("script");
      s.src = src;
      s.async = true;
      s.setAttribute("data-pdf-lib", src);
      s.onload = function(){ resolve(); };
      s.onerror = function(){ reject(new Error("load failed: " + src)); };
      document.head.appendChild(s);
    });
  }

  function ensurePdfLibs(){
    if(pdfLibsPromise) return pdfLibsPromise;
    if(typeof window.html2canvas === "function" && window.jspdf && window.jspdf.jsPDF){
      pdfLibsPromise = Promise.resolve();
      return pdfLibsPromise;
    }
    pdfLibsPromise = loadScriptOnce(PDF_LIB_URLS[0]).then(function(){
      return loadScriptOnce(PDF_LIB_URLS[1]);
    }).then(function(){
      if(!(typeof window.html2canvas === "function" && window.jspdf && window.jspdf.jsPDF)){
        throw new Error("PDF作成用ライブラリの初期化に失敗しました");
      }
    }).catch(function(e){
      pdfLibsPromise = null; // 失敗時は次回また読み込みを試せるようにする
      throw e;
    });
    return pdfLibsPromise;
  }

  // ---------- レシート読み取り（OCR）機能 ----------
  // 外部のOCR（文字認識）ライブラリ Tesseract.js を、「レシートを読み取る」が
  // 最初に押されたときにだけCDNから読み込む。アプリ起動時には読み込まないため、
  // この機能を使わない限り、これまで通りの「外部通信ゼロ」の起動が保たれる。
  const OCR_LIB_URL = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
  let ocrLibPromise = null;

  function ensureOcrLib(){
    if(ocrLibPromise) return ocrLibPromise;
    if(window.Tesseract && typeof window.Tesseract.recognize === "function"){
      ocrLibPromise = Promise.resolve();
      return ocrLibPromise;
    }
    ocrLibPromise = loadScriptOnce(OCR_LIB_URL).then(function(){
      if(!(window.Tesseract && typeof window.Tesseract.recognize === "function")){
        throw new Error("文字認識ライブラリの初期化に失敗しました");
      }
    }).catch(function(e){
      ocrLibPromise = null;
      throw e;
    });
    return ocrLibPromise;
  }

  // 画像を一度<canvas>に描画する。これには2つの狙いがある：
  // (1) HEIC等、ブラウザによっては直接デコードできない画像形式を使った場合に、
  //     ここで確実に失敗を検知できる（失敗時は分かりやすいエラーメッセージを出す）
  // (2) OCRにかける前に、サイズ調整・コントラスト強調などの前処理を行える
  function loadImageToCanvas(file){
    return new Promise(function(resolve, reject){
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = function(){
        URL.revokeObjectURL(url);
        if(!img.naturalWidth || !img.naturalHeight){
          reject(new Error("画像を読み込めませんでした（サイズが取得できません）"));
          return;
        }
        // 大きすぎる写真はOCRが遅くなるうえ精度も上がらないため、
        // 長辺を1800pxを目安に縮小する（小さい画像はそのまま）。
        const maxSide = 1800;
        const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.round(img.naturalWidth * scale);
        const h = Math.round(img.naturalHeight * scale);
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas);
      };
      img.onerror = function(){
        URL.revokeObjectURL(url);
        reject(new Error("画像の形式に対応していないため読み込めませんでした（HEIC形式などが原因の場合があります）"));
      };
      img.src = url;
    });
  }

  // グレースケール化＋二値化（白黒化）を行う。レシートは「白い紙に黒い文字」の
  // コントラストが本来ハッキリしているが、木目調のテーブルなど背景が写り込んだ
  // 写真では、OCRが背景の模様（木目の線など）まで文字と誤認しやすい。
  // Otsu法（画像処理で広く使われる、明暗を自動で最適な境目で「白」と「黒」に
  // 分ける手法）で二値化することで、文字だけをくっきり残しつつ、背景の
  // 模様のノイズを大きく減らせる。単純な明るさ調整よりも効果が高い。
  function preprocessForOcr(canvas){
    const ctx = canvas.getContext("2d");
    const w = canvas.width, h = canvas.height;
    const imageData = ctx.getImageData(0, 0, w, h);
    const px = imageData.data;
    const n = w * h;
    const gray = new Uint8ClampedArray(n);
    const hist = new Array(256).fill(0);
    for(let i = 0, p = 0; i < n; i++, p += 4){
      const g = Math.round(0.299 * px[p] + 0.587 * px[p+1] + 0.114 * px[p+2]);
      gray[i] = g;
      hist[g]++;
    }
    // Otsu法：クラス間分散が最大になる明るさのしきい値を総当たりで探す
    let sumAll = 0;
    for(let t = 0; t < 256; t++) sumAll += t * hist[t];
    let sumB = 0, weightB = 0, maxVar = 0, threshold = 128;
    for(let t = 0; t < 256; t++){
      weightB += hist[t];
      if(weightB === 0) continue;
      const weightF = n - weightB;
      if(weightF === 0) break;
      sumB += t * hist[t];
      const meanB = sumB / weightB;
      const meanF = (sumAll - sumB) / weightF;
      const varBetween = weightB * weightF * (meanB - meanF) * (meanB - meanF);
      if(varBetween > maxVar){ maxVar = varBetween; threshold = t; }
    }
    for(let i = 0, p = 0; i < n; i++, p += 4){
      const v = gray[i] > threshold ? 255 : 0;
      px[p] = v; px[p+1] = v; px[p+2] = v;
    }
    ctx.putImageData(imageData, 0, 0);
    return canvas;
  }

  // 画像から文字を読み取る。日本語＋英語の学習データを使う
  // （学習データ自体もTesseract.jsが初回のみ自動でダウンロードする）。
  // レシートは縦に長い1つの文字ブロックであることが多いため、
  // ページ全体を解析する既定モードではなく「単一のテキストブロック」を
  // 前提としたモード（PSM 6）を明示的に指定し、読み取り精度を高めている。
  function runOcr(file){
    let worker;
    return ensureOcrLib().then(function(){
      return loadImageToCanvas(file);
    }).then(function(canvas){
      return preprocessForOcr(canvas);
    }).then(function(canvas){
      return window.Tesseract.createWorker("jpn+eng").then(function(w){
        worker = w;
        return worker.setParameters({ tessedit_pageseg_mode: "6" });
      }).then(function(){
        return worker.recognize(canvas);
      }).then(function(result){
        return worker.terminate().then(function(){
          return (result && result.data && result.data.text) || "";
        });
      });
    }).catch(function(e){
      if(worker){ try{ worker.terminate(); }catch(e2){} }
      throw e;
    });
  }

  // レシートの文字から、金額・日付・カテゴリー・メモ（お店の名前など）を
  // 推測する簡易的なルール。あくまで「たたき台」を作るためのもので、
  // 必ず人の目で確認してから登録する前提としている。
  const RECEIPT_CATEGORY_RULES = [
    {type:"variable", category:"食費", words:["スーパー","マート","イオン","西友","ライフ","まいばすけっと","オーケー","コンビニ","セブン-イレブン","セブンイレブン","ローソン","ファミリーマート","生鮮","青果","精肉","フード"]},
    {type:"variable", category:"日用品", words:["ドラッグ","薬局","ダイソー","セリア","キャンドゥ","ホームセンター","ドン・キホーテ","ドンキホーテ"]},
    {type:"variable", category:"医療費", words:["病院","クリニック","歯科","診療","調剤薬局","医院"]},
    {type:"variable", category:"交通費", words:["ガソリン","ENEOS","出光","コスモ石油","タクシー","駐車場","高速道路","ＪＲ","JR","私鉄","バス","ETC"]},
    {type:"variable", category:"被服費", words:["ユニクロ","UNIQLO","ＧＵ","GU","しまむら","西松屋","洋服の青山"]},
    {type:"variable", category:"交際費", words:["居酒屋","レストラン","カラオケ","バー","スナック"]},
    {type:"variable", category:"娯楽費", words:["シネマ","映画","遊園地","ゲームセンター"]},
    {type:"variable", category:"教育費", words:["書店","本屋","塾","教材","文房具"]},
    {type:"fixed", category:"光熱費", words:["電力","電気料金","ガス料金","水道局","水道料金"]},
    {type:"fixed", category:"通信費", words:["携帯","モバイル","ドコモ","ａｕ","au ","ソフトバンク","楽天モバイル"]}
  ];

  function guessExpenseCategory(text){
    for(let i=0; i<RECEIPT_CATEGORY_RULES.length; i++){
      const rule = RECEIPT_CATEGORY_RULES[i];
      for(let j=0; j<rule.words.length; j++){
        if(text.indexOf(rule.words[j]) !== -1){
          return {type: rule.type, category: rule.category};
        }
      }
    }
    // どれにも当てはまらない場合は、レシートとして最も可能性の高い
    // 「その他変動費」を初期値にしておく（固定費の紙レシートは稀なため）。
    return {type: "variable", category: "その他変動費"};
  }

  function guessExpenseAmount(rawText){
    // iPhoneのテキスト認識などでは全角数字・全角記号のこともあるため、半角にそろえる
    const text = toHalfWidth(rawText);
    // 「合計」「お会計」などを優先し、無ければ「計」で探す（「小計」は税抜のことが多いため後回し）
    const totalPatterns = [
      /(?:お?支払(?:い)?(?:金額|額)?|ご請求額|お会計|御会計|総合計|合計|総額)[^0-9\n]{0,12}([0-9][0-9,]{0,9})/,
      /(?:^|[^小])計[^0-9\n]{0,12}([0-9][0-9,]{0,9})/
    ];
    for(let i=0; i<totalPatterns.length; i++){
      const m = text.match(totalPatterns[i]);
      if(m){
        const n = parseInt(m[1].replace(/,/g, ""), 10);
        if(n > 0) return n;
      }
    }
    // 「合計」等の文字が見つからない場合は、文中の金額らしき数値のうち
    // 最も大きいものを採用する（レシートの合計額は多くの場合、最大の数値になるため）。
    // ただし「お預り」「お釣り」や電話番号・登録番号の行は除く。
    const usable = text.split("\n").filter(function(line){
      return !/(預|釣|つり|TEL|Tel|電話|登録番号|No\.|ポイント|残高)/.test(line);
    }).join("\n");
    const matches = usable.match(/[0-9]{1,3}(?:,[0-9]{3})+|[0-9]{3,7}/g) || [];
    const nums = matches
      .map(function(s){ return parseInt(s.replace(/,/g, ""), 10); })
      .filter(function(n){ return n > 0 && n < 1000000; });
    if(nums.length) return Math.max.apply(null, nums);
    return null;
  }

  function guessExpenseDate(rawText){
    const text = toHalfWidth(rawText);
    function fmt(y, mo, d){
      const moN = parseInt(mo, 10), dN = parseInt(d, 10);
      if(!(moN >= 1 && moN <= 12 && dN >= 1 && dN <= 31)) return null;
      return y + "-" + String(moN).padStart(2, "0") + "-" + String(dN).padStart(2, "0");
    }
    let m = text.match(/(20[0-9]{2})\s*[\/\.\-年]\s*([0-1]?[0-9])\s*[\/\.\-月]\s*([0-3]?[0-9])/);
    if(m){ const r = fmt(m[1], m[2], m[3]); if(r) return r; }
    // 令和の表記（令和8年10月12日 → 2026-10-12）
    m = text.match(/(?:令和|R)\s*([0-9]{1,2})\s*[年\.\/]\s*([0-1]?[0-9])\s*[月\.\/]\s*([0-3]?[0-9])/);
    if(m){ const r = fmt(String(2018 + parseInt(m[1], 10)), m[2], m[3]); if(r) return r; }
    // 2桁の西暦（26/10/12）
    m = text.match(/(?:^|[^0-9])([2-9][0-9])\/([0-1]?[0-9])\/([0-3]?[0-9])(?:[^0-9]|$)/);
    if(m){ const r = fmt("20" + m[1], m[2], m[3]); if(r) return r; }
    return todayStr();
  }

  function guessExpenseMemo(text){
    const lines = text.split("\n").map(function(l){ return l.trim(); }).filter(Boolean);
    return lines.length ? lines[0].slice(0, 30) : "";
  }

  function categoryOptionsHtml(type, selected){
    return expenseCats(type).map(function(c){
      return `<option value="${escapeHtml(c.key)}" ${c.key === selected ? "selected" : ""}>${escapeHtml(c.key)}</option>`;
    }).join("");
  }

  function showReceiptStatus(html){
    const box = el("receiptStatus");
    if(box) box.innerHTML = html;
  }

  function renderReceiptReview(guess, ocrText, previewUrl){
    const amountMissing = !guess.amount;
    showReceiptStatus(`
      <div class="receipt-review">
        ${previewUrl ? `<img class="receipt-preview" src="${previewUrl}" alt="読み取ったレシートの画像">` : ""}
        <p class="hint">読み取った内容です。間違っている場合は修正してから登録してください。</p>
        ${amountMissing ? `<p class="hint" style="color:var(--danger);">⚠️ 金額を自動で読み取れませんでした。「金額」欄に手動で入力してから登録してください。</p>` : ""}
        <div class="field"><label>種別</label>
          <select id="receipt-type">
            <option value="fixed" ${guess.type === "fixed" ? "selected" : ""}>固定費</option>
            <option value="variable" ${guess.type === "variable" ? "selected" : ""}>変動費</option>
          </select>
        </div>
        <div class="field"><label>カテゴリー</label>
          <select id="receipt-cat">${categoryOptionsHtml(guess.type, guess.category)}</select>
        </div>
        <div class="field"><label>日付</label><input type="date" id="receipt-date" value="${escapeHtml(guess.date)}"></div>
        <div class="field"><label>メモ（お店の名前など）</label><input type="text" id="receipt-memo" maxlength="100" value="${escapeHtml(guess.memo || "")}"></div>
        <div class="field"><label>金額</label><input type="text" inputmode="decimal" id="receipt-amount" value="${guess.amount || ""}" placeholder="金額を入力"></div>

  // 画像化したレポートを、A4サイズのPDFに1〜複数ページにわたって貼り付ける。
  // （同じ画像を、ページごとに上方向へずらしながら繰り返し貼ることで、
  //   長いレポートも自動的に複数ページに分割されるようにしている）
  function buildPdfFromCanvas(canvas, jsPDFCtor){
    const pdf = new jsPDFCtor("p", "mm", "a4");
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const margin = 10;
    const usableWidth = pageWidth - margin * 2;
    const usableHeight = pageHeight - margin * 2;
    const imgWidth = usableWidth;
    const imgHeight = (canvas.height * imgWidth) / canvas.width;
    const imgData = canvas.toDataURL("image/png");

    let heightLeft = imgHeight;
    let position = margin;
    pdf.addImage(imgData, "PNG", margin, position, imgWidth, imgHeight);
    heightLeft -= usableHeight;

    while(heightLeft > 0){
      position = margin - (imgHeight - heightLeft);
      pdf.addPage();
      pdf.addImage(imgData, "PNG", margin, position, imgWidth, imgHeight);
      heightLeft -= usableHeight;
    }
    return pdf;
  }

  function mergeIncoming(parsed){
    const addedRecords = []; // [{kind, record}]
    ["incomes","expenses","savings"].forEach(function(k){
      const existingIds = new Set(data[k].map(function(x){ return x.id; }));
      cleanRecords(parsed[k]).forEach(function(item){
        if(item && item.id && !existingIds.has(item.id)){
          data[k].push(item);
          existingIds.add(item.id);
          addedRecords.push({kind: k, record: item});
        }
      });
    });
    // 予算は「まだ自分の端末で設定していないカテゴリーのみ」取り込む
    // （すでに設定済みの予算を、古いバックアップで上書きしてしまわないようにするため）。
    let budgetsChanged = false;
    if(parsed.budgets && typeof parsed.budgets === "object"){
      Object.keys(parsed.budgets).forEach(function(cat){
        if(!(cat in data.budgets)){
          data.budgets[cat] = parsed.budgets[cat];
          budgetsChanged = true;
        }
      });
    }
    return { addedRecords: addedRecords, budgetsChanged: budgetsChanged };
  }

  function importDataFromFile(file){
    const reader = new FileReader();
    reader.onload = function(){
      let parsed, mergeResult;
      try{
        parsed = JSON.parse(reader.result);
        mergeResult = mergeIncoming(parsed);
      }catch(e){
        console.error(e);
        alert("ファイルの読み込みに失敗しました。書き出し機能で作成したファイルを選択してください。");
        return;
      }
      const addedRecords = mergeResult.addedRecords;
      let savePromise;
      if(storageMode === "realtime" && addedRecords.length){
        // レコードごとにFirebaseへ書き込む（1件ずつ順番に処理する）
        savePromise = addedRecords.reduce(function(chain, item){
          return chain.then(function(){
            return window.firebaseSync.writeHouseholdPath(HOUSEHOLD_ID, item.kind + "/" + item.record.id, recordWithoutId(item.record));
          });
        }, Promise.resolve());
        if(mergeResult.budgetsChanged){
          savePromise = savePromise.then(function(){
            return window.firebaseSync.writeHouseholdPath(HOUSEHOLD_ID, "budgets", data.budgets);
          });
        }
        savePromise = savePromise.catch(realtimeWriteFailed);
      }else{
        savePromise = saveData();
      }
      savePromise.then(function(){
        render();
        renderTabs();
        alert(addedRecords.length > 0 ? (addedRecords.length + "件のデータを取り込みました。") : "新しく取り込めるデータはありませんでした（すでに同じ内容が登録されています）。");
      });
    };
    reader.readAsText(file);
  }

          : "この家計から抜けますか？もう一度参加するには、ほかのメンバーから招待コードを教えてもらう必要があります。";
        if(!confirm(msg)) return;
        leavingHousehold = true;
        window.firebaseSync.leaveHousehold(HOUSEHOLD_ID, currentUser.uid, isLast, householdMeta.inviteCode).then(function(){

    const current = effectiveBudgets(currentMonth);
    return `
      <p class="hint">空欄のカテゴリーは「予算なし」として扱われます（内訳に達成率は表示されません）。</p>
      ${variableCats().map(function(c){
        const val = current[c.key] || "";
        return `<div class="field"><label>${escapeHtml(c.key)}</label><input type="number" min="0" inputmode="numeric" class="budget-input" data-cat="${escapeHtml(c.key)}" value="${val}" placeholder="例：60000"></div>`;
      }).join("")}
      <label class="check-row" ${canUseHouseholdSettings() ? "" : "hidden"}><input type="checkbox" id="budgetMonthOnly" ${monthOnly ? "checked" : ""}><span>${monthLabel(currentMonth)}だけの予算として保存する（チェックしない場合は、毎月共通の予算になります）</span></label>
      <button class="add-btn" id="budgetSaveBtn" style="width:100%;">予算を保存する</button>
      ${monthOnly ? `<button class="ghost-btn" id="budgetMonthResetBtn" style="width:100%;margin-top:8px;">${monthLabel(currentMonth)}の個別予算を削除して、毎月共通の予算に戻す</button>` : ""}
    `;
  }

  function initBudgetPanel(){
    const toggleBtn = el("budgetToggleBtn");
    const area = el("budgetEditArea");
    if(!toggleBtn || !area) return;
    function afterSave(){
      area.hidden = true;
      renderExpensePanel();
      renderDashboardPanel();
    }
    toggleBtn.onclick = function(){
      if(area.hidden){
        area.innerHTML = budgetEditAreaHtml();
        area.hidden = false;
        el("budgetSaveBtn").onclick = function(){
          const newBudgets = {};
          each(document.querySelectorAll(".budget-input"), function(inp){
            const v = parseFloat(inp.value);
            if(v > 0) newBudgets[inp.dataset.cat] = v;
          });
          const monthOnly = el("budgetMonthOnly").checked;
          let chain = persistBudgets(newBudgets, monthOnly ? currentMonth : null);
          // 「この月だけ」のチェックを外して保存した場合は、その月の個別予算を消して共通に戻す
          if(!monthOnly && hasMonthBudget(currentMonth)){
            chain = chain.then(function(){ return persistBudgets(null, currentMonth); });
          }
          chain.then(afterSave);
        };
        if(el("budgetMonthResetBtn")){
          el("budgetMonthResetBtn").onclick = function(){
            persistBudgets(null, currentMonth).then(afterSave);
          };
        }
      }else{
        area.hidden = true;
      }
    };
  }

  // ---------- 先月の固定費をコピーする ----------
  function copyLastMonthFixed(){
    const [y, m] = currentMonth.split("-").map(Number);
    const prevDate = new Date(y, m - 2, 1); // m は1始まり。前月の1日を求める
    const prevMonth = prevDate.getFullYear() + "-" + String(prevDate.getMonth() + 1).padStart(2, "0");
    const prevFixed = data.expenses.filter(function(e){
      return e.type === "fixed" && e.date.slice(0, 7) === prevMonth;
    });
    if(!prevFixed.length){
      alert(monthLabel(prevMonth) + "の固定費の記録が見つかりませんでした。");
      return;
    }
    // 今月にすでに同じ内容（カテゴリー・メモ・金額が同じ）の固定費があるものはコピーしない。
    // ふたりがそれぞれボタンを押した場合や、2回押した場合の二重登録を防ぐ。
    const thisMonthFixed = data.expenses.filter(function(e){ return e.type === "fixed" && inMonth(e.date); });
    const toCopy = prevFixed.filter(function(src){
      return !thisMonthFixed.some(function(e){
        return e.category === src.category && (e.memo || "") === (src.memo || "") && e.amount === src.amount;
      });
    });
    const skipped = prevFixed.length - toCopy.length;
    if(!toCopy.length){
      alert(monthLabel(prevMonth) + "の固定費は、すでに" + monthLabel(currentMonth) + "にすべてコピーされています。");
      return;
    }
    const confirmMsg = monthLabel(prevMonth) + "の固定費（" + toCopy.length + "件）を、" + monthLabel(currentMonth) + "分としてコピーします。よろしいですか？"
      + (skipped ? "\n（同じ内容がすでに今月にある " + skipped + "件は、二重にならないようコピーしません）" : "");
    if(!confirm(confirmMsg)) return;

    const targetDate = currentMonth + "-01";
    let chain = Promise.resolve();
    toCopy.forEach(function(src){
      chain = chain.then(function(){
        const record = buildRecordBase({
          type: "fixed",
          date: targetDate,
          category: src.category,
          memo: src.memo || "",
          amount: src.amount
        });
        return persistAdd("expenses", record);
      });
    });
    chain.then(function(){
      renderExpensePanel();
      renderDashboardPanel();

  // ---------- 一覧の編集・削除（収入・支出・貯金で共通） ----------
  function isEditing(kind, id){

    return `<button class="edit" data-kind="${kind}" data-id="${escapeHtml(id)}" title="修正する" aria-label="修正する">✎</button>` +

  // 2回買い物をした場合など）。
  function editRowHtml(kind, rec, options, catLabel){
    // 一覧にない区分の記録でも、編集で勝手に別の区分に変わらないよう選択肢に加える
    if(!options.some(function(o){ return o.value === rec.category; })){

    }
    const optionHtml = options.map(function(o){
      return `<option value="${escapeHtml(o.value)}"${o.value === rec.category ? " selected" : ""}>${escapeHtml(o.label)}</option>`;
    }).join("");
    return `<tr class="edit-row"><td colspan="5">
      <div class="entry-form edit-form" data-kind="${kind}" data-id="${escapeHtml(rec.id)}">

  function bindRowActions(panelId){
    const panel = el(panelId);
    // スマートフォン幅で編集フォームが画面外にはみ出さないよう、編集中の表に印を付ける
    each(panel.querySelectorAll(".edit-row"), function(row){
      const table = row.closest("table");
      if(table) table.classList.add("has-edit");
    });
    each(panel.querySelectorAll(".del"), function(btn){
      btn.onclick = function(){
        const kind = btn.dataset.kind, id = btn.dataset.id;
        if(isEditing(kind, id)) editing = null;
        persistDelete(kind, id).then(rerenderRecordPanels);
      };
    });
    each(panel.querySelectorAll(".edit"), function(btn){
      btn.onclick = function(){
        editing = { kind: btn.dataset.kind, id: btn.dataset.id };
        rerenderRecordPanels();
        const amountInput = el(panelId).querySelector(".edit-form .ed-amount");
        if(amountInput) amountInput.focus();
      };
    });
    each(panel.querySelectorAll(".edit-form"), function(form){
      const kind = form.dataset.kind, id = form.dataset.id;
      form.querySelector(".ed-cancel").onclick = function(){
        editing = null;
        rerenderRecordPanels();
      };
      form.querySelector(".ed-save").onclick = function(){
        const amountInput = form.querySelector(".ed-amount");
        const plusInput = form.querySelector(".ed-plus");
        const amount = parseAmount(amountInput.value);
        if(!(amount > 0)){ amountInput.focus(); return; }
        let plus = 0;
        if(plusInput.value.trim()){
          plus = parseAmount(plusInput.value);
          if(!(plus > 0)){ plusInput.focus(); return; }
        }
        const dateVal = form.querySelector(".ed-date").value;
        if(!dateVal){ form.querySelector(".ed-date").focus(); return; }
        const changes = {
          date: dateVal,
          category: form.querySelector(".ed-cat").value,
          memo: form.querySelector(".ed-memo").value.trim(),
          amount: Math.round((amount + plus) * 100) / 100
        };
        editing = null;
        persistUpdate(kind, id, changes).then(rerenderRecordPanels);
      };
    });
  }

  // ---------- 検索 ----------
  // メモ・お店の名前・カテゴリー・記録者で、全期間の記録から探す。
  let searchState = { q: "", kind: "all", from: "", to: "", ran: false };
  const SEARCH_LIMIT = 300;

  function searchResults(){
    const q = searchState.q.trim().toLowerCase();
    return allRecordsForList().filter(function(r){
      if(searchState.kind === "incomes" && r.kind !== "incomes") return false;
      if(searchState.kind === "savings" && r.kind !== "savings") return false;
      if(searchState.kind === "fixed" && !(r.kind === "expenses" && r.rec.type === "fixed")) return false;
      if(searchState.kind === "variable" && !(r.kind === "expenses" && r.rec.type === "variable")) return false;
      if(searchState.from && r.rec.date < searchState.from) return false;
      if(searchState.to && r.rec.date > searchState.to) return false;
      if(q){
        const hay = [r.rec.memo || "", r.catLabel, r.rec.addedBy ? String(r.rec.addedBy).split("@")[0] : ""].join(" ").toLowerCase();
        if(hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }
