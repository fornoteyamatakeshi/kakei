<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ふたり家計簿</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--
  夫婦2人だけで使うプライベートなアプリのため、検索エンジンには
  一切インデックスされないようにしている（下記のrobotsタグ）。
  Netlify等の外部ホスティングを使う場合は、同梱のrobots.txtも
  一緒に公開すること（下部の詳細設計書を参照）。
-->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<!--
  このアプリは通信環境に左右されず、スマートフォンでも単体のファイルとして
  必ず開けるように、外部フォント・外部グラフライブラリを一切使わず
  端末に内蔵されたフォントとSVGだけで描画しています。
-->
<style>
  :root{
    --paper:#F6F1E7;
    --paper-raised:#FFFFFF;
    --ink:#26313A;
    --ink-soft:#5C6B74;
    --indigo:#26456B;
    --indigo-deep:#16304D;
    --gold:#C99A3E;
    --income:#3F8564;
    --fixed:#3A5A82;
    --variable:#B4623F;
    --saving:#B4913A;
    --line:#E3D9C4;
    --danger:#B4463F;
    --shadow: 0 1px 2px rgba(38,49,58,0.06), 0 4px 14px rgba(38,49,58,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      linear-gradient(180deg, rgba(38,69,107,0.03), rgba(38,69,107,0) 220px),
      var(--paper);
    color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic Medium","YuGothic","Noto Sans CJK JP","Meiryo",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .serif{font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif CJK JP",serif;}
  .wrap{max-width:960px;margin:0 auto;padding:28px 20px 80px;}

  /* Header */
  .app-header{
    display:flex;align-items:flex-end;justify-content:space-between;
    padding-bottom:18px;margin-bottom:22px;
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:40px;height:40px;border-radius:10px;
    background:linear-gradient(135deg, var(--indigo), var(--indigo-deep));
    display:flex;align-items:center;justify-content:center;
    color:var(--paper);font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif CJK JP",serif;font-weight:700;font-size:19px;
    box-shadow:var(--shadow);
  }
  .brand-text h1{
    font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif CJK JP",serif;font-weight:700;
    font-size:23px;margin:0;letter-spacing:.02em;color:var(--indigo-deep);
  }
  .brand-text p{margin:2px 0 0;font-size:12px;color:var(--ink-soft);letter-spacing:.04em;}

  .month-nav{display:flex;align-items:center;gap:10px;}
  .month-nav button{
    width:32px;height:32px;border-radius:8px;border:1px solid var(--line);
    background:var(--paper-raised);color:var(--indigo);font-size:15px;cursor:pointer;
  }
  .month-nav button:hover{background:#EFE7D4;}
  .month-label{
    font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif CJK JP",serif;font-size:18px;font-weight:700;color:var(--indigo-deep);
    min-width:104px;text-align:center;
  }

  /* ヘッダー右側（月切り替え＋メニュー） */
  .header-controls{display:flex;align-items:center;gap:10px;}
  .hamburger-btn{
    width:36px;height:36px;border-radius:8px;border:1px solid var(--line);
    background:var(--paper-raised);color:var(--indigo-deep);font-size:17px;cursor:pointer;
    flex-shrink:0;line-height:1;
  }
  .hamburger-btn:hover{background:#EFE7D4;}

  /* ハンバーガーメニューから開くナビゲーション */
  .nav-menu{
    display:flex;flex-direction:column;gap:4px;
    background:var(--paper-raised);border:1px solid var(--line);border-radius:12px;
    padding:8px;margin-bottom:18px;box-shadow:var(--shadow);
  }
  .nav-menu-item{
    text-align:left;background:none;border:none;padding:11px 14px;border-radius:8px;
    font-size:14px;color:var(--ink);cursor:pointer;font-family:inherit;
  }
  .nav-menu-item:hover{background:#EFE7D4;}
  .nav-menu-item.active{background:var(--indigo-deep);color:#fff;}

  /* Tabs */
  .tabs{display:flex;gap:6px;margin-bottom:22px;flex-wrap:wrap;}
  .tab-btn{
    padding:9px 16px;border-radius:999px;border:1px solid var(--line);
    background:var(--paper-raised);color:var(--ink-soft);font-size:13.5px;font-weight:500;
    cursor:pointer;font-family:inherit;letter-spacing:.02em;transition:.15s;
  }
  .tab-btn.active{background:var(--indigo-deep);border-color:var(--indigo-deep);color:#fff;box-shadow:var(--shadow);}
  .tab-btn:not(.active):hover{background:#EFE7D4;}

  .panel{display:none;}
  .panel.active{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  /* Cards */
  .card{
    background:var(--paper-raised);border:1px solid var(--line);border-radius:14px;
    padding:20px;margin-bottom:18px;box-shadow:var(--shadow);
  }
  .card h2{
    font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif CJK JP",serif;font-size:16px;margin:0 0 14px;color:var(--indigo-deep);
    display:flex;align-items:center;gap:8px;
  }
  .cat-dot{width:9px;height:9px;border-radius:50%;display:inline-block;}

  /* Form */
  .entry-form{display:grid;grid-template-columns:130px 1fr 130px auto;gap:10px;align-items:end;margin-bottom:6px;}
  .entry-form.with-cat{grid-template-columns:130px 150px 1fr 130px auto;}
  .field{display:flex;flex-direction:column;gap:5px;min-width:0;}
  .field label{font-size:11.5px;color:var(--ink-soft);letter-spacing:.03em;}
  input,select{
    border:1px solid var(--line);border-radius:8px;padding:9px 10px;
    /* 16px以上にしておかないと、iOSのSafariが入力欄タップ時に画面全体を
       自動拡大してしまい、レイアウトが崩れて見える原因になるため固定している */
    font-size:16px;
    font-family:inherit;background:#FCFAF4;color:var(--ink);
    width:100%;min-width:0;box-sizing:border-box;
    max-width:100%;
  }
  select{
    /* 長い選択肢（例：子供NISA（ジュニアNISA））でもグリッド枠からはみ出さないように */
    text-overflow:ellipsis;
  }
  /*
     日付入力は iOS Safari で通常の input と異なり、ネイティブの
     日付コントロールが独自の最小幅を持つことがある。
     そのため「width:100%」だけでは、親要素より右側にはみ出す場合がある。
     appearance を通常の input と同じにし、WebKit 内部の部品も幅を制限する。
     タップ時のネイティブ日付ピッカー自体は type="date" のまま利用できる。
  */
  input[type="date"]{
    -webkit-appearance:none;
    appearance:none;
    display:block;
    width:100%;
    min-width:0;
    max-width:100%;
    inline-size:100%;
    min-inline-size:0;
    max-inline-size:100%;
    padding:9px 10px;
    overflow:hidden;
    box-sizing:border-box;
  }
  input[type="date"]::-webkit-datetime-edit,
  input[type="date"]::-webkit-datetime-edit-fields-wrapper,
  input[type="date"]::-webkit-date-and-time-value{
    width:100%;
    min-width:0;
    max-width:100%;
    margin:0;
    padding:0;
    box-sizing:border-box;
  }
  input[type="date"]::-webkit-calendar-picker-indicator{
    display:none;
  }
  @supports (-webkit-touch-callout:none){
    input[type="date"]{
      -webkit-appearance:none;
      appearance:none;
      width:100%;
      min-width:0;
      max-width:100%;
    }
  }
  input:focus,select:focus{outline:2px solid var(--indigo);outline-offset:1px;}
  .add-btn{
    background:var(--indigo-deep);color:#fff;border:none;border-radius:8px;
    padding:11px 18px;font-size:14.5px;font-weight:500;cursor:pointer;font-family:inherit;
    white-space:nowrap;min-height:44px;
  }
  .add-btn:hover{background:var(--indigo);}

  /* Table */
  table{width:100%;min-width:480px;border-collapse:collapse;margin-top:14px;font-size:13.5px;}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px;}
  th{
    text-align:left;font-weight:500;color:var(--ink-soft);font-size:11.5px;
    letter-spacing:.04em;border-bottom:1px solid var(--line);padding:0 8px 8px;
  }
  td{padding:9px 8px;border-bottom:1px solid #EFE9DB;}
  tr:last-child td{border-bottom:none;}
  .amt{font-variant-numeric:tabular-nums;text-align:right;font-weight:500;}
  .del{
    background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:16px;
    line-height:1;padding:2px 6px;border-radius:6px;
  }
  .del:hover{background:#F3E3E0;color:var(--danger);}
  .empty-row{color:var(--ink-soft);font-size:13px;text-align:center;padding:22px 0;}
  .cat-tag{
    font-size:11px;padding:2px 8px;border-radius:999px;color:#fff;white-space:nowrap;
  }
  .added-by-tag{
    font-size:10px;color:var(--ink-soft);
  }
  .subtotal-row td{font-weight:700;border-top:1px solid var(--line);border-bottom:none;padding-top:11px;}

  /* 変動費の予算設定・達成率表示 */
  .budget-panel{margin-bottom:6px;}
  .legend-list.with-budget li{display:block;padding:7px 0;}
  .legend-row{display:flex;justify-content:space-between;align-items:center;}
  .legend-budget{font-size:11px;margin-top:2px;}
  .budget-bar-track{
    height:5px;border-radius:3px;background:#EFE9DB;margin-top:4px;overflow:hidden;
  }
  .budget-bar-fill{height:100%;border-radius:3px;}

  /* Dashboard */
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
  .stat{
    background:var(--paper-raised);border:1px solid var(--line);border-radius:14px;
    padding:16px 18px;box-shadow:var(--shadow);
  }
  .stat .label{font-size:11.5px;color:var(--ink-soft);letter-spacing:.03em;margin-bottom:6px;}
  .stat .value{font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif CJK JP",serif;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;}
  .stat.income .value{color:var(--income);}
  .stat.expense .value{color:var(--variable);}
  .stat.saving .value{color:var(--saving);}
  .stat.balance .value{color:var(--indigo-deep);}
  .charts{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;}
  .chart-box{position:relative;height:230px;}
  .breakdown{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px;}
  .legend-list{list-style:none;margin:10px 0 0;padding:0;font-size:13px;}
  .legend-list li{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line);}
  .legend-list li:last-child{border-bottom:none;}
  .legend-name{display:flex;align-items:center;gap:7px;color:var(--ink);}

  .hint{font-size:12px;color:var(--ink-soft);margin:-6px 0 14px;line-height:1.7;}
  .save-status{
    position:fixed;bottom:18px;right:18px;background:var(--indigo-deep);color:#fff;
    padding:8px 16px;border-radius:999px;font-size:12.5px;box-shadow:var(--shadow);
    opacity:0;transform:translateY(6px);transition:.25s;pointer-events:none;
    z-index:50;
  }
  .save-status.show{opacity:1;transform:none;}
  .loading-screen{
    display:flex;align-items:center;justify-content:center;height:60vh;
    color:var(--ink-soft);font-size:14px;
  }
  .error-screen{
    max-width:440px;margin:60px auto;text-align:center;color:var(--ink);
    background:var(--paper-raised);border:1px solid var(--line);border-radius:14px;
    padding:32px 24px;box-shadow:var(--shadow);
  }
  .error-screen p{color:var(--ink-soft);font-size:13.5px;line-height:1.8;}
  .error-screen button{
    margin-top:10px;background:var(--indigo-deep);color:#fff;border:none;border-radius:8px;
    padding:9px 20px;font-size:13.5px;cursor:pointer;font-family:inherit;
  }

  /* Storage mode banner */
  .mode-banner{
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    background:var(--paper-raised);border:1px solid var(--line);border-radius:12px;
    padding:10px 14px;margin-bottom:18px;box-shadow:var(--shadow);
  }
  .mode-banner .mode-text{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft);}
  .mode-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .mode-dot.cloud{background:var(--income);}
  .mode-dot.local{background:var(--gold);}
  .mode-actions{display:flex;gap:8px;}
  .ghost-btn{
    background:var(--paper);border:1px solid var(--line);color:var(--indigo-deep);
    border-radius:8px;padding:6px 12px;font-size:12.5px;cursor:pointer;font-family:inherit;
    white-space:nowrap;
  }
  .ghost-btn:hover{background:#EFE7D4;}

  /* 接続切れの警告バナー（リアルタイム共有モードで、接続が一度切れた場合のみ表示） */
  .disconnect-banner{
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    background:#FBF0EC;border:1px solid var(--danger);border-radius:12px;
    padding:10px 14px;margin:-8px 0 18px;font-size:12.5px;color:var(--danger);
  }
  .disconnect-banner .ghost-btn{color:var(--danger);border-color:var(--danger);}

  @media (max-width:720px){
    .entry-form,.entry-form.with-cat{grid-template-columns:1fr 1fr;}
    .add-btn{grid-column:1/-1;}
    /* 日付欄はブラウザ標準のカレンダー部品を含み、他の項目と1行を分け合うと
       窮屈になりやすいため、2列レイアウトの間も常に1行を専有させる */
    .field-date{grid-column:1/-1;}
    .stat-grid{grid-template-columns:1fr 1fr;}
    .charts,.breakdown{grid-template-columns:1fr;}
  }

  /* スマートフォン相当の幅（480px以下）では、入力欄を1列に積み上げて
     タップしやすい大きさを確保する。ブラウザの画面幅にあわせて
     自動的にこのレイアウトへ切り替わる（機種の判定ではなく画面幅で判定）。 */
  @media (max-width:480px){
    .wrap{padding:16px 12px 70px;}
    .app-header{flex-wrap:wrap;gap:10px;}
    .entry-form,.entry-form.with-cat{grid-template-columns:minmax(0,1fr);}
    .field{width:100%;min-width:0;max-width:100%;}
    .field-date{grid-column:1;width:100%;min-width:0;max-width:100%;}
    .field-date input[type="date"]{width:100%;min-width:0;max-width:100%;}
    .add-btn{grid-column:1;width:100%;}
    .stat-grid{grid-template-columns:1fr;}
    .card{padding:16px;}
    .month-nav{width:100%;justify-content:space-between;}
    .mode-banner{flex-direction:column;align-items:stretch;}
    .mode-actions{width:100%;}
    .ghost-btn{flex:1;}
  }

  /* タッチ操作の端末（スマートフォン・タブレット）では、ボタンなどの
     タップ領域を少し広めに取る。JS側で <html> に is-touch クラスを
     付与して判定している（画面幅だけでなく入力方式でも判定するため）。 */
  .is-touch .add-btn,.is-touch .ghost-btn,.is-touch .tab-btn{min-height:40px;}
  .is-touch .del{min-width:32px;min-height:32px;display:inline-flex;align-items:center;justify-content:center;}

  /* PDF出力ボタンを目立たせるためのカード枠（通常の画面表示用） */
  .print-card{border:1px dashed var(--indigo);background:#F2F6FA;}
  .print-card .add-btn:disabled{opacity:.6;cursor:default;}

  /* レシート読み取り機能 */
  .receipt-card{border:1px dashed var(--saving);background:#FBF6E9;}
  .receipt-card .add-btn:disabled{opacity:.6;cursor:default;}
  .receipt-review{
    margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);
  }
  .receipt-review .field{margin-bottom:10px;}
  .receipt-review-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
  .receipt-review-actions .add-btn,.receipt-review-actions .ghost-btn{flex:1;min-width:140px;}
  .receipt-ocr-raw{
    margin-top:12px;font-size:11.5px;color:var(--ink-soft);
  }
  .receipt-ocr-raw summary{cursor:pointer;}
  .receipt-ocr-raw pre{
    white-space:pre-wrap;word-break:break-word;background:#FCFAF4;
    border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:6px;
    max-height:160px;overflow-y:auto;
  }
  .receipt-preview{max-width:100%;max-height:220px;border-radius:8px;margin:10px 0;display:block;}

  /* PDF化する内容を一時的に描画しておくための、画面には見えない領域。
     display:noneではなくfixed+画面外配置にしているのは、html2canvasが
     「実際にレイアウトされた要素」でないと正しく画像化できないため。 */
  #pdfRenderContainer{
    position:fixed;left:-9999px;top:0;width:780px;background:#fff;color:#1a1a1a;
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic Medium","YuGothic","Meiryo",sans-serif;
    padding:16px;
  }
  #pdfRenderContainer h1{font-size:22px;margin:0 0 4px;color:#16304D;}
  #pdfRenderContainer .print-sub{font-size:12px;color:#555;margin:0 0 16px;}
  #pdfRenderContainer h2{font-size:15px;color:#16304D;border-left:4px solid #C99A3E;padding-left:8px;margin:20px 0 8px;}
  #pdfRenderContainer table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:4px;}
  #pdfRenderContainer th{text-align:left;border-bottom:1px solid #999;padding:5px 7px;background:#F3F1EA;}
  #pdfRenderContainer td{border-bottom:1px solid #ddd;padding:5px 7px;}
  #pdfRenderContainer td.amt,#pdfRenderContainer th.amt{text-align:right;font-variant-numeric:tabular-nums;}
  #pdfRenderContainer tr.print-subtotal td{font-weight:700;border-top:1px solid #999;border-bottom:2px solid #16304D;}
  #pdfRenderContainer .print-summary{width:100%;border-collapse:collapse;margin-bottom:8px;}
  #pdfRenderContainer .print-summary td{border:1px solid #999;padding:10px 12px;font-size:13px;}
  #pdfRenderContainer .print-summary td.print-summary-label{color:#555;font-size:11px;}
  #pdfRenderContainer .print-summary td.print-summary-value{font-size:16px;font-weight:700;text-align:right;}
  #pdfRenderContainer .print-empty{color:#777;font-size:11px;padding:6px 0;}
  #pdfRenderContainer .print-footer{margin-top:22px;font-size:10px;color:#777;border-top:1px solid #ccc;padding-top:7px;}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading-screen">読み込んでいます…</div>
</div>

<div class="save-status" id="saveStatus">保存しました</div>

<!-- PDF出力の際、内容を一時的に描画しておくための領域（画面には表示されない） -->
<div id="pdfRenderContainer"></div>

<!--
  夫婦間のリアルタイム共有（Firebase Realtime Database）用の設定。
  ここで使っているapiKey等は「アプリの居場所を示す識別子」であり、
  これ自体が漏れても即座に情報が読み書きされるわけではない
  （実際のアクセス制御はデータベース側の「ルール」で行っている）。
  このスクリプトが読み込めない場合（オフライン、通信制限など）は、
  window.firebaseSyncが設定されないため、アプリは自動的に
  この端末内保存（localStorage）に切り替わる。
-->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import { getDatabase, ref, set, remove, update, get, onValue } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";
  import {
    getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
    onAuthStateChanged, signOut,
    updateEmail as fbUpdateEmail, updatePassword as fbUpdatePassword
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDRoZXsH-22lmpXe9r9DlJVtZZWrd7rmUc",
    authDomain: "our-household-budget-68d2a.firebaseapp.com",
    databaseURL: "https://our-household-budget-68d2a-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "our-household-budget-68d2a",
    storageBucket: "our-household-budget-68d2a.firebasestorage.app",
    messagingSenderId: "242198106288",
    appId: "1:242198106288:web:7770d4c13eef35d8972b75"
  };

  // 招待コード（household ID）としてランダムな文字列を作るための簡易関数。
  // Firebaseのpush()が生成するID相当の、ある程度衝突しにくい文字列を作る。
  function randomHouseholdId(){
    const part = function(){ return Math.random().toString(36).slice(2, 10); };
    return part() + part() + Date.now().toString(36);
  }

  try{
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    window.firebaseSync = {
      configured: true,
      subscribe: function(householdId, onData, onError){
        try{
          const dbRef = ref(db, "households/" + householdId);
          onValue(dbRef, function(snapshot){
            onData(snapshot.val());
          }, function(err){
            if(onError) onError(err);
          });
        }catch(e){
          if(onError) onError(e);
        }
      },
      writeRecord: function(householdId, kind, id, recordWithoutId){
        return set(ref(db, "households/" + householdId + "/" + kind + "/" + id), recordWithoutId);
      },
      deleteRecord: function(householdId, kind, id){
        return remove(ref(db, "households/" + householdId + "/" + kind + "/" + id));
      },
      // 変動費のカテゴリー別予算（{カテゴリー名: 金額}の単純なオブジェクト）を
      // まるごと保存する。個々のレコードのような単位ではないため、
      // writeRecordとは別に専用の関数を用意している。
      setBudgets: function(householdId, budgets){
        return set(ref(db, "households/" + householdId + "/budgets"), budgets);
      },
      // Firebase専用の特別なパス「.info/connected」を購読すると、
      // 今まさにサーバーへ接続できているかどうかが分かる。
      // これを使って「今は最新の状態と繋がっているか」を画面に表示する。
      watchConnection: function(onChange){
        try{
          onValue(ref(db, ".info/connected"), function(snapshot){
            onChange(!!snapshot.val());
          });
        }catch(e){
          console.log("接続状態の監視に失敗しました:", e);
        }
      },
      // ---------- ここからログイン・世帯（household）管理 ----------
      auth: {
        register: function(email, password){
          return createUserWithEmailAndPassword(auth, email, password).then(function(cred){ return cred.user; });
        },
        login: function(email, password){
          return signInWithEmailAndPassword(auth, email, password).then(function(cred){ return cred.user; });
        },
        logout: function(){
          return signOut(auth);
        },
        onChange: function(cb){
          onAuthStateChanged(auth, cb);
        },
        updateEmailAddress: function(newEmail){
          return fbUpdateEmail(auth.currentUser, newEmail);
        },
        updatePasswordValue: function(newPassword){
          return fbUpdatePassword(auth.currentUser, newPassword);
        }
      },
      // ログイン中のユーザーが、すでにどの世帯（household）に所属しているかを調べる
      getUserHousehold: function(uid){
        return get(ref(db, "users/" + uid + "/householdId")).then(function(snap){
          return snap.exists() ? snap.val() : null;
        });
      },
      // 新しい世帯を作り、自分をその最初のメンバーとして登録する
      createHousehold: function(uid){
        const id = randomHouseholdId();
        const updates = {};
        updates["households/" + id + "/members/" + uid] = true;
        updates["users/" + uid + "/householdId"] = id;
        return update(ref(db), updates).then(function(){ return id; });
      },
      // 招待コード（既存のhousehold ID）を使って、既存の世帯に参加する
      joinHousehold: function(uid, householdId){
        const updates = {};
        updates["households/" + householdId + "/members/" + uid] = true;
        updates["users/" + uid + "/householdId"] = householdId;
        return update(ref(db), updates).then(function(){ return householdId; });
      }
    };
  }catch(e){
    console.log("Firebaseの初期化に失敗したため、リアルタイム共有は無効になります（この端末内保存に切り替わります）:", e);
    window.firebaseSync = { configured: false };
  }
</script>

<script>
(function(){
  "use strict";

  const INCOME_CATS = [
    {key:"husband", label:"夫の収入", color:"#3F8564"},
    {key:"wife", label:"妻の収入", color:"#5C9E7C"},
    {key:"irregular", label:"臨時収入", color:"#8FBFA2"},
    {key:"government", label:"役所からの収入", color:"#2E6B49"}
  ];
  const FIXED_CATS = [
    {key:"家賃・住宅ローン", color:"#26456B"},
    {key:"光熱費", color:"#3A5A82"},
    {key:"通信費", color:"#4E7098"},
    {key:"保険料", color:"#6285AA"},
    {key:"サブスク", color:"#7699B8"},
    {key:"その他固定費", color:"#8FAEC6"}
  ];
  const VARIABLE_CATS = [
    {key:"食費", color:"#B4623F"},
    {key:"日用品", color:"#C07850"},
    {key:"医療費", color:"#CC8E61"},
    {key:"交通費", color:"#D8A472"},
    {key:"被服費", color:"#A85236"},
    {key:"交際費", color:"#96442D"},
    {key:"娯楽費", color:"#843724"},
    {key:"教育費", color:"#E4BA83"},
    {key:"その他変動費", color:"#EAD0A6"}
  ];
  const SAVING_CATS = [
    {key:"savings", label:"貯金", color:"#B4913A"},
    {key:"nisa", label:"NISA", color:"#C7A94F"},
    {key:"kids_nisa", label:"子供NISA（ジュニアNISA）", color:"#D9C177"},
    {key:"ideco", label:"iDeCo", color:"#8F6E22"}
  ];

  const STORAGE_KEY = "budget-data-v1";
  // 以前の固定の合言葉（ログイン機能を追加する前に使っていたもの）。
  // すでにこのIDでデータを入力していた場合、ログイン後に「招待コードで参加する」に
  // この値を入力すれば、これまでのデータにそのままアクセスできる。
  const LEGACY_HOUSEHOLD_ID = "UtepwPCAX6u3pqPDwkGV7fW6JKQwPEMg";
  // ログイン・世帯（household）の参加状況に応じて、実行時に決まる値。
  // ログイン前や世帯未参加の間は null のまま。
  let HOUSEHOLD_ID = null;
  let currentUser = null;
  const el = id => document.getElementById(id);
  const yen = n => "¥" + Math.round(n).toLocaleString("ja-JP");
  // 一部の古いブラウザ・組み込みブラウザでは NodeList.forEach が使えないため、
  // 互換性の高い方法でループを回す小さなヘルパー。
  function each(nodeList, fn){
    for(let i=0; i<nodeList.length; i++){ fn(nodeList[i], i); }
  }
  const todayStr = () => new Date().toISOString().slice(0,10);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

  let data = { incomes: [], expenses: [], savings: [], budgets: {} };
  let currentMonth = todayStr().slice(0,7); // YYYY-MM
  let activeTab = "income";
  // currentPage: "main" = 収支の記録・ダッシュボード / "mypage" = マイページ（設定）
  let currentPage = "main";
  let menuOpen = false;
  // storageMode: "cloud"    = Claudeアーティファクトの共有ストレージ
  //              "realtime" = Firebase Realtime Databaseでの即時共有
  //              "local"    = この端末のブラウザ内保存のみ
  let storageMode = "local";

  function applyParsed(parsed){
    data.incomes = (parsed && parsed.incomes) || [];
    data.expenses = (parsed && parsed.expenses) || [];
    data.savings = (parsed && parsed.savings) || [];
    data.budgets = (parsed && parsed.budgets) || {};
  }

  function objectToArray(obj){
    if(!obj) return [];
    return Object.keys(obj).map(function(id){
      const rec = Object.assign({}, obj[id]);
      rec.id = id;
      return rec;
    });
  }

  function applyFirebaseSnapshot(val){
    data.incomes = objectToArray(val && val.incomes);
    data.expenses = objectToArray(val && val.expenses);
    data.savings = objectToArray(val && val.savings);
    data.budgets = (val && val.budgets) || {};
  }

  // 注意：このアプリはスマートフォンの標準ブラウザや、機種・アプリ内ブラウザの違いによる
  // 互換性の問題を避けるため、意図的に async/await を使わず Promise の .then()/.catch() で
  // 非同期処理を記述している（一部の組み込みブラウザでは async 構文の解釈に失敗することがあるため）。
  function loadLocalFallback(){
    storageMode = "local";
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw) applyParsed(JSON.parse(raw));
    }catch(e){
      console.log("この端末内保存も利用できません:", e);
    }
  }

  // Firebaseが設定されていればリアルタイム共有を試み、ダメなら端末内保存に切り替える。
  function tryRealtimeThenLocal(resolve){
    if(!(window.firebaseSync && window.firebaseSync.configured)){
      loadLocalFallback();
      resolve();
      return;
    }
    let settled = false;
    const timeoutId = setTimeout(function(){
      if(settled) return;
      settled = true;
      console.log("リアルタイム共有への接続がタイムアウトしたため、この端末内保存に切り替えます");
      loadLocalFallback();
      resolve();
    }, 6000);

    window.firebaseSync.subscribe(HOUSEHOLD_ID, function(val){
      if(!settled){
        settled = true;
        clearTimeout(timeoutId);
        storageMode = "realtime";
        applyFirebaseSnapshot(val);
        startConnectionWatch();
        resolve();
      }else{
        // 2回目以降の呼び出し＝自分または相手の端末での変更がリアルタイムに届いたもの
        applyFirebaseSnapshot(val);
        render();
        renderTabs();
      }
    }, function(err){
      if(settled) return;
      settled = true;
      clearTimeout(timeoutId);
      console.log("リアルタイム共有への接続に失敗したため、この端末内保存に切り替えます:", err);
      loadLocalFallback();
      resolve();
    });
  }

  // 接続状態の監視（「相手の更新が届いているか」をユーザーが確認できるようにする）。
  // 初回接続後に一度でも接続が切れたら、connectionLost=true にして再読み込みを促す。
  // 切断直後の一瞬の揺らぎで警告が出ないよう、少し待ってから判定する。
  let connectionLost = false;
  let hasConnectedOnce = false;
  function startConnectionWatch(){
    if(!(window.firebaseSync && window.firebaseSync.watchConnection)) return;
    window.firebaseSync.watchConnection(function(isConnected){
      if(isConnected){
        hasConnectedOnce = true;
        if(connectionLost){
          connectionLost = false;
          render();
          renderTabs();
        }
      }else if(hasConnectedOnce){
        connectionLost = true;
        render();
        renderTabs();
      }
    });
  }

  function loadData(){
    return new Promise(function(resolve){
      // 1) Claudeのアーティファクト上で動作している場合は共有ストレージを試す
      if(typeof window.storage !== "undefined" && window.storage && typeof window.storage.get === "function"){
        window.storage.get(STORAGE_KEY, true).then(function(res){
          storageMode = "cloud";
          if(res && res.value) applyParsed(JSON.parse(res.value));
          resolve();
        }).catch(function(e){
          console.log("共有ストレージが利用できないため、他の保存方法を試します:", e);
          tryRealtimeThenLocal(resolve);
        });
        return;
      }
      // 2) Firebaseが設定されていればリアルタイム共有、なければ端末内保存(localStorage)
      tryRealtimeThenLocal(resolve);
    });
  }

  // isCloud時代の一括保存（共有ストレージ／端末内保存の両モードで使用。
  // realtimeモードはレコード単位で保存するため saveData() は使わない）
  function saveData(){
    const json = JSON.stringify(data);
    function saveLocal(){
      try{
        localStorage.setItem(STORAGE_KEY, json);
        flashSaved();
      }catch(e){
        console.error("保存エラー:", e);
      }
    }
    if(storageMode === "cloud"){
      try{
        return window.storage.set(STORAGE_KEY, json, true).then(function(result){
          if(!result) throw new Error("empty result");
          flashSaved();
        }).catch(function(e){
          console.error("共有保存に失敗したため、この端末内保存に切り替えます:", e);
          storageMode = "local";
          saveLocal();
        });
      }catch(e){
        console.error("共有保存の呼び出しに失敗したため、この端末内保存に切り替えます:", e);
        storageMode = "local";
      }
    }
    saveLocal();
    return Promise.resolve();
  }

  // 追加・削除の1件ごとの永続化。realtimeモードのときはFirebaseの該当パスのみを
  // 書き換える（レコード単位）。それ以外のモードでは全体を書き直す従来方式のまま。
  function kindLabel(kind){
    if(kind === "incomes") return "収入";
    if(kind === "expenses") return "支出";
    if(kind === "savings") return "貯金・資産形成";
    return kind;
  }

  // スマートフォンへの通知（ntfy.sh、無料・登録不要のプッシュ通知サービス）。
  // 世帯（household）ごとに固有の通知トピックへ送信する。送信に失敗しても
  // アプリの他の機能には一切影響しない（あくまで補助的な機能のため）。
  function sendNtfyNotification(title, message){
    if(!HOUSEHOLD_ID) return;
    try{
      fetch("https://ntfy.sh/", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ topic: "kakeibo-" + HOUSEHOLD_ID, title: title, message: message })
      }).catch(function(e){
        console.log("通知の送信に失敗しました（アプリの動作には影響しません）:", e);
      });
    }catch(e){
      console.log("通知の送信に失敗しました（アプリの動作には影響しません）:", e);
    }
  }

  function persistAdd(kind, record){
    if(storageMode === "realtime"){
      const clone = Object.assign({}, record);
      delete clone.id;
      return window.firebaseSync.writeRecord(HOUSEHOLD_ID, kind, record.id, clone).then(function(){
        flashSaved();
        sendNtfyNotification(
          "ふたり家計簿：" + kindLabel(kind) + "が追加されました",
          record.date + "　" + yen(record.amount) + (record.memo ? "　" + record.memo : "")
        );
      }).catch(function(e){
        console.error("リアルタイム保存に失敗したため、この端末内保存に切り替えます:", e);
        storageMode = "local";
        data[kind].push(record);
        return saveData();
      });
    }
    data[kind].push(record);
    return saveData();
  }

  function persistDelete(kind, id){
    if(storageMode === "realtime"){
      return window.firebaseSync.deleteRecord(HOUSEHOLD_ID, kind, id).then(function(){
        flashSaved();
        sendNtfyNotification(
          "ふたり家計簿：" + kindLabel(kind) + "が削除されました",
          "記録が1件削除されました"
        );
      }).catch(function(e){
        console.error("リアルタイム削除に失敗したため、この端末内保存に切り替えます:", e);
        storageMode = "local";
        data[kind] = data[kind].filter(function(x){ return x.id !== id; });
        return saveData();
      });
    }
    data[kind] = data[kind].filter(function(x){ return x.id !== id; });
    return saveData();
  }

  // レコード（収入・支出・貯金）に共通の項目を組み立てる。
  // ログイン中（リアルタイム共有モード）であれば、「誰が記録したか」を
  // 一緒に保存しておく（addedBy）。ログインしていない場合は付与しない。
  function buildRecordBase(fields){
    const record = Object.assign({ id: uid() }, fields);
    if(storageMode === "realtime" && currentUser && currentUser.email){
      record.addedBy = currentUser.email;
    }
    return record;
  }

  // 一覧表に表示する「記録した人」の小さなラベル。メールアドレスの
  // @より前の部分だけを表示し、addedByが無い場合は何も表示しない。
  function addedByTag(record){
    if(!record || !record.addedBy) return "";
    return `<br><span class="added-by-tag">${escapeHtml(record.addedBy.split("@")[0])}</span>`;
  }

  // 変動費のカテゴリー別予算の保存。予算は「今月分」のような月ごとの値では
  // なく、毎月の目安として1つだけ持たせるシンプルな仕組みにしている
  // （多くの家庭では「食費は毎月○万円」のように、月によって変えるより
  // 一定の目安を使い続けることが多いという想定による）。
  function persistBudgets(budgets){
    data.budgets = budgets;
    if(storageMode === "realtime"){
      return window.firebaseSync.setBudgets(HOUSEHOLD_ID, budgets).then(function(){
        flashSaved();
      }).catch(function(e){
        console.error("予算の保存に失敗したため、この端末内保存に切り替えます:", e);
        storageMode = "local";
        return saveData();
      });
    }
    return saveData();
  }


  // ---------- Export / Import (端末間でデータをまとめる) ----------
  function exportData(){
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const stamp = todayStr().replace(/-/g,"");
    a.href = url;
    a.download = `household-budget-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  // ---------- 月次レポートのPDF出力 ----------
  function detailRows(list, categoryLabelFn){
    if(!list.length) return `<tr><td colspan="4" class="print-empty">記録がありません</td></tr>`;
    return list.slice().sort(function(a,b){ return a.date.localeCompare(b.date); }).map(function(x){
      return `<tr>
        <td>${x.date}</td>
        <td>${escapeHtml(categoryLabelFn(x))}</td>
        <td>${escapeHtml(x.memo || "")}</td>
        <td class="amt">${yen(x.amount)}</td>
      </tr>`;
    }).join("");
  }

  function buildPrintReportHTML(){
    const incomes = data.incomes.filter(function(i){ return inMonth(i.date); });
    const fixed = data.expenses.filter(function(e){ return inMonth(e.date) && e.type === "fixed"; });
    const variable = data.expenses.filter(function(e){ return inMonth(e.date) && e.type === "variable"; });
    const savings = data.savings.filter(function(s){ return inMonth(s.date); });

    const totalIncome = incomes.reduce(function(s,i){ return s+i.amount; }, 0);
    const totalFixed = fixed.reduce(function(s,i){ return s+i.amount; }, 0);
    const totalVariable = variable.reduce(function(s,i){ return s+i.amount; }, 0);
    const totalExpense = totalFixed + totalVariable;
    const totalSaving = savings.reduce(function(s,i){ return s+i.amount; }, 0);
    const balance = totalIncome - totalExpense - totalSaving;
    const savingRate = totalIncome > 0 ? Math.round((totalSaving/totalIncome)*100) : 0;

    const incomeLabel = function(x){ const c = INCOME_CATS.find(function(c){ return c.key===x.category; }); return c ? c.label : x.category; };
    const savingLabel = function(x){ const c = SAVING_CATS.find(function(c){ return c.key===x.category; }); return c ? c.label : x.category; };
    const plainLabel = function(x){ return x.category; };

    const printedAt = new Date();
    const printedAtStr = printedAt.getFullYear() + "年" + (printedAt.getMonth()+1) + "月" + printedAt.getDate() + "日";

    return `
      <h1>ふたり家計簿　月次レポート</h1>
      <p class="print-sub">対象月：${monthLabel(currentMonth)}　／　作成日：${printedAtStr}</p>

      <table class="print-summary">
        <tr>
          <td class="print-summary-label">収入合計</td><td class="print-summary-value">${yen(totalIncome)}</td>
          <td class="print-summary-label">支出合計（固定+変動）</td><td class="print-summary-value">${yen(totalExpense)}</td>
        </tr>
        <tr>
          <td class="print-summary-label">貯金・積立合計</td><td class="print-summary-value">${yen(totalSaving)}</td>
          <td class="print-summary-label">収支残高</td><td class="print-summary-value">${yen(balance)}</td>
        </tr>
        <tr>
          <td class="print-summary-label">貯蓄率</td><td class="print-summary-value">${savingRate}%</td>
          <td class="print-summary-label">固定費／変動費</td><td class="print-summary-value">${yen(totalFixed)} ／ ${yen(totalVariable)}</td>
        </tr>
      </table>

      <h2>収入明細</h2>
      <table>
        <thead><tr><th>日付</th><th>区分</th><th>メモ</th><th class="amt">金額</th></tr></thead>
        <tbody>
          ${detailRows(incomes, incomeLabel)}
          <tr class="print-subtotal"><td colspan="3">収入合計</td><td class="amt">${yen(totalIncome)}</td></tr>
        </tbody>
      </table>

      <h2>固定費明細</h2>
      <table>
        <thead><tr><th>日付</th><th>カテゴリー</th><th>メモ</th><th class="amt">金額</th></tr></thead>
        <tbody>
          ${detailRows(fixed, plainLabel)}
          <tr class="print-subtotal"><td colspan="3">固定費合計</td><td class="amt">${yen(totalFixed)}</td></tr>
        </tbody>
      </table>

      <h2>変動費明細</h2>
      <table>
        <thead><tr><th>日付</th><th>カテゴリー</th><th>メモ</th><th class="amt">金額</th></tr></thead>
        <tbody>
          ${detailRows(variable, plainLabel)}
          <tr class="print-subtotal"><td colspan="3">変動費合計</td><td class="amt">${yen(totalVariable)}</td></tr>
        </tbody>
      </table>

      <h2>貯金・資産形成明細</h2>
      <table>
        <thead><tr><th>日付</th><th>区分</th><th>メモ</th><th class="amt">金額</th></tr></thead>
        <tbody>
          ${detailRows(savings, savingLabel)}
          <tr class="print-subtotal"><td colspan="3">貯金・積立合計</td><td class="amt">${yen(totalSaving)}</td></tr>
        </tbody>
      </table>

      <p class="print-footer">ふたり家計簿アプリより出力（${printedAtStr}作成）。この用紙は家庭内の記録・保管を目的としたものです。</p>
    `;
  }

  // html2canvas・jsPDF（いずれもブラウザで完結するPDF作成用の定番ライブラリ）を
  // 初回のPDF出力時にだけ、CDNから読み込む。日本語フォントをPDFに埋め込む処理は
  // 複雑なため、レポートの見た目を一度画像として描画し、その画像をPDFに貼り付ける
  // 方式にすることで、日本語もそのまま綺麗に出力できるようにしている。
  const PDF_LIB_URLS = [
    "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js",
    "https://cdnjs.cloudflare.com/ajax/libs/jspdf/4.2.1/jspdf.umd.min.js"
  ];
  let pdfLibsPromise = null;

  function loadScriptOnce(src){
    return new Promise(function(resolve, reject){
      const existing = document.querySelector('script[data-pdf-lib="' + src + '"]');
      if(existing){ resolve(); return; }
      const s = document.createElement("script");
      s.src = src;
      s.async = true;
      s.setAttribute("data-pdf-lib", src);
      s.onload = function(){ resolve(); };
      s.onerror = function(){ reject(new Error("load failed: " + src)); };
      document.head.appendChild(s);
    });
  }

  function ensurePdfLibs(){
    if(pdfLibsPromise) return pdfLibsPromise;
    if(typeof window.html2canvas === "function" && window.jspdf && window.jspdf.jsPDF){
      pdfLibsPromise = Promise.resolve();
      return pdfLibsPromise;
    }
    pdfLibsPromise = loadScriptOnce(PDF_LIB_URLS[0]).then(function(){
      return loadScriptOnce(PDF_LIB_URLS[1]);
    }).then(function(){
      if(!(typeof window.html2canvas === "function" && window.jspdf && window.jspdf.jsPDF)){
        throw new Error("PDF作成用ライブラリの初期化に失敗しました");
      }
    }).catch(function(e){
      pdfLibsPromise = null; // 失敗時は次回また読み込みを試せるようにする
      throw e;
    });
    return pdfLibsPromise;
  }

  // ---------- レシート読み取り（OCR）機能 ----------
  // 外部のOCR（文字認識）ライブラリ Tesseract.js を、「レシートを読み取る」が
  // 最初に押されたときにだけCDNから読み込む。アプリ起動時には読み込まないため、
  // この機能を使わない限り、これまで通りの「外部通信ゼロ」の起動が保たれる。
  const OCR_LIB_URL = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
  let ocrLibPromise = null;

  function ensureOcrLib(){
    if(ocrLibPromise) return ocrLibPromise;
    if(window.Tesseract && typeof window.Tesseract.recognize === "function"){
      ocrLibPromise = Promise.resolve();
      return ocrLibPromise;
    }
    ocrLibPromise = loadScriptOnce(OCR_LIB_URL).then(function(){
      if(!(window.Tesseract && typeof window.Tesseract.recognize === "function")){
        throw new Error("文字認識ライブラリの初期化に失敗しました");
      }
    }).catch(function(e){
      ocrLibPromise = null;
      throw e;
    });
    return ocrLibPromise;
  }

  // 画像から文字を読み取る。日本語＋英語の学習データを使う
  // （学習データ自体もTesseract.jsが初回のみ自動でダウンロードする）。
  function runOcr(file){
    return ensureOcrLib().then(function(){
      return window.Tesseract.recognize(file, "jpn+eng");
    }).then(function(result){
      return (result && result.data && result.data.text) || "";
    });
  }

  // レシートの文字から、金額・日付・カテゴリー・メモ（お店の名前など）を
  // 推測する簡易的なルール。あくまで「たたき台」を作るためのもので、
  // 必ず人の目で確認してから登録する前提としている。
  const RECEIPT_CATEGORY_RULES = [
    {type:"variable", category:"食費", words:["スーパー","マート","イオン","西友","ライフ","まいばすけっと","オーケー","コンビニ","セブン-イレブン","セブンイレブン","ローソン","ファミリーマート","生鮮","青果","精肉","フード"]},
    {type:"variable", category:"日用品", words:["ドラッグ","薬局","ダイソー","セリア","キャンドゥ","ホームセンター","ドン・キホーテ","ドンキホーテ"]},
    {type:"variable", category:"医療費", words:["病院","クリニック","歯科","診療","調剤薬局","医院"]},
    {type:"variable", category:"交通費", words:["ガソリン","ENEOS","出光","コスモ石油","タクシー","駐車場","高速道路","ＪＲ","JR","私鉄","バス","ETC"]},
    {type:"variable", category:"被服費", words:["ユニクロ","UNIQLO","ＧＵ","GU","しまむら","西松屋","洋服の青山"]},
    {type:"variable", category:"交際費", words:["居酒屋","レストラン","カラオケ","バー","スナック"]},
    {type:"variable", category:"娯楽費", words:["シネマ","映画","遊園地","ゲームセンター"]},
    {type:"variable", category:"教育費", words:["書店","本屋","塾","教材","文房具"]},
    {type:"fixed", category:"光熱費", words:["電力","電気料金","ガス料金","水道局","水道料金"]},
    {type:"fixed", category:"通信費", words:["携帯","モバイル","ドコモ","ａｕ","ソフトバンク","楽天モバイル"]}
  ];

  function guessExpenseCategory(text){
    for(let i=0; i<RECEIPT_CATEGORY_RULES.length; i++){
      const rule = RECEIPT_CATEGORY_RULES[i];
      for(let j=0; j<rule.words.length; j++){
        if(text.indexOf(rule.words[j]) !== -1){
          return {type: rule.type, category: rule.category};
        }
      }
    }
    // どれにも当てはまらない場合は、レシートとして最も可能性の高い
    // 「その他変動費」を初期値にしておく（固定費の紙レシートは稀なため）。
    return {type: "variable", category: "その他変動費"};
  }

  function guessExpenseAmount(text){
    const totalMatch = text.match(/(?:合計|お会計|御会計|総額|計)[^0-9]{0,10}([0-9][0-9,]{1,9})/);
    if(totalMatch){
      const n = parseInt(totalMatch[1].replace(/,/g, ""), 10);
      if(n > 0) return n;
    }
    // 「合計」等の文字が見つからない場合は、文中の金額らしき数値のうち
    // 最も大きいものを採用する（レシートの合計額は多くの場合、最大の数値になるため）。
    const matches = text.match(/[0-9]{1,3}(?:,[0-9]{3})+|[0-9]{3,7}/g) || [];
    const nums = matches
      .map(function(s){ return parseInt(s.replace(/,/g, ""), 10); })
      .filter(function(n){ return n > 0 && n < 1000000; });
    if(nums.length) return Math.max.apply(null, nums);
    return null;
  }

  function guessExpenseDate(text){
    const m = text.match(/(20[0-9]{2})[\/\.年]\s*([0-1]?[0-9])[\/\.月]\s*([0-3]?[0-9])/);
    if(m){
      const mo = String(parseInt(m[2], 10)).padStart(2, "0");
      const d = String(parseInt(m[3], 10)).padStart(2, "0");
      return m[1] + "-" + mo + "-" + d;
    }
    return todayStr();
  }

  function guessExpenseMemo(text){
    const lines = text.split("\n").map(function(l){ return l.trim(); }).filter(Boolean);
    return lines.length ? lines[0].slice(0, 30) : "";
  }

  function categoryOptionsHtml(type, selected){
    const cats = type === "fixed" ? FIXED_CATS : VARIABLE_CATS;
    return cats.map(function(c){
      return `<option value="${c.key}" ${c.key === selected ? "selected" : ""}>${c.key}</option>`;
    }).join("");
  }

  function showReceiptStatus(html){
    const box = el("receiptStatus");
    if(box) box.innerHTML = html;
  }

  function renderReceiptReview(guess, ocrText, previewUrl){
    showReceiptStatus(`
      <div class="receipt-review">
        ${previewUrl ? `<img class="receipt-preview" src="${previewUrl}" alt="読み取ったレシートの画像">` : ""}
        <p class="hint">読み取った内容です。間違っている場合は修正してから登録してください。</p>
        <div class="field"><label>種別</label>
          <select id="receipt-type">
            <option value="fixed" ${guess.type === "fixed" ? "selected" : ""}>固定費</option>
            <option value="variable" ${guess.type === "variable" ? "selected" : ""}>変動費</option>

  function initReceiptScan(){
    const btn = el("receiptScanBtn");
    const fileInput = el("receiptFileInput");
    if(!btn || !fileInput) return;
    btn.onclick = function(){ fileInput.click(); };
    fileInput.onchange = function(e){
      const file = e.target.files && e.target.files[0];
      fileInput.value = "";
      if(!file) return;

      let previewUrl = "";
      try{ previewUrl = URL.createObjectURL(file); }catch(e2){ previewUrl = ""; }

      showReceiptStatus(`
        ${previewUrl ? `<img class="receipt-preview" src="${previewUrl}" alt="読み取り中のレシート画像">` : ""}
        <p class="hint">画像を解析しています…（初回はライブラリの読み込みのため、少し時間がかかります）</p>
      `);

      runOcr(file).then(function(text){
        const amount = guessExpenseAmount(text);
        const date = guessExpenseDate(text);
        const catGuess = guessExpenseCategory(text);
        const memo = guessExpenseMemo(text);
        renderReceiptReview({
          type: catGuess.type,
          category: catGuess.category,
          date: date,
          memo: memo,
          amount: amount || 0
        }, text, previewUrl);
      }).catch(function(e){
        console.error("レシートの読み取りに失敗しました:", e);
        showReceiptStatus(`
          ${previewUrl ? `<img class="receipt-preview" src="${previewUrl}" alt="読み取りに失敗したレシート画像">` : ""}
          <p class="hint">読み取りに失敗しました。通信環境の良い場所で、もう一度お試しください。うまくいかない場合は、下の入力欄に直接ご入力ください。</p>
        `);
      });
    };
  }

  // 画像化したレポートを、A4サイズのPDFに1〜複数ページにわたって貼り付ける。
  // （同じ画像を、ページごとに上方向へずらしながら繰り返し貼ることで、
  //   長いレポートも自動的に複数ページに分割されるようにしている）
  function buildPdfFromCanvas(canvas, jsPDFCtor){
    const pdf = new jsPDFCtor("p", "mm", "a4");
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const margin = 10;
    const usableWidth = pageWidth - margin * 2;
    const usableHeight = pageHeight - margin * 2;
    const imgWidth = usableWidth;
    const imgHeight = (canvas.height * imgWidth) / canvas.width;
    const imgData = canvas.toDataURL("image/png");

    let heightLeft = imgHeight;
    let position = margin;
    pdf.addImage(imgData, "PNG", margin, position, imgWidth, imgHeight);
    heightLeft -= usableHeight;

    while(heightLeft > 0){
      position = margin - (imgHeight - heightLeft);
      pdf.addPage();
      pdf.addImage(imgData, "PNG", margin, position, imgWidth, imgHeight);
      heightLeft -= usableHeight;
    }
    return pdf;
  }

  function setPdfButtonBusy(busy){
    const btn = el("pdfExportBtn");
    if(!btn) return;
    btn.disabled = busy;
    btn.textContent = busy ? "PDFを作成しています…" : ("🖨️ " + monthLabel(currentMonth) + "のレポートをPDF出力する");
  }

  // ライブラリが読み込めなかった場合（オフライン等）のフォールバック。
  // 従来通り、印刷専用の別文書をiframeに作り、ブラウザの印刷ダイアログを開く。
  function exportMonthlyPDFViaPrint(){
    const reportHTML = buildPrintReportHTML();
    const printCss = `
      @page{ margin:14mm; }
      *{ box-sizing:border-box; }
      body{ margin:0;color:#1a1a1a;background:#fff;
        font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic Medium","YuGothic","Meiryo",sans-serif; }
      h1{font-size:19px;margin:0 0 4px;color:#16304D;}
      .print-sub{font-size:11px;color:#555;margin:0 0 14px;}

      table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:4px;}
      th{text-align:left;border-bottom:1px solid #999;padding:4px 6px;background:#F3F1EA;}
      td{border-bottom:1px solid #ddd;padding:4px 6px;}

      .print-summary{width:100%;border-collapse:collapse;margin-bottom:6px;}

      .print-summary td.print-summary-label{color:#555;font-size:10.5px;}
      .print-summary td.print-summary-value{font-size:15px;font-weight:700;text-align:right;}
      .print-empty{color:#777;font-size:10.5px;padding:6px 0;}
      .print-footer{margin-top:20px;font-size:9.5px;color:#777;border-top:1px solid #ccc;padding-top:6px;}
    `;
    const doc = "<!DOCTYPE html><html lang=\"ja\"><head><meta charset=\"UTF-8\">"
      + "<title>ふたり家計簿レポート</title><style>" + printCss + "</style></head>"
      + "<body>" + reportHTML + "</body></html>";

    const iframe = document.createElement("iframe");
    iframe.style.position = "fixed";
    iframe.style.right = "0";
    iframe.style.bottom = "0";
    iframe.style.width = "0";
    iframe.style.height = "0";
    iframe.style.border = "0";
    iframe.setAttribute("aria-hidden", "true");
    document.body.appendChild(iframe);

    function cleanup(){
      if(iframe.parentNode){ iframe.parentNode.removeChild(iframe); }
    }
    try{
      const idoc = iframe.contentWindow.document;
      idoc.open();
      idoc.write(doc);
      idoc.close();
    }catch(e){
      console.error("PDF出力用の文書を作成できませんでした:", e);
      cleanup();
      alert("PDF出力の準備に失敗しました。お使いのブラウザで再度お試しください。");
      return;
    }
    setTimeout(function(){
      try{
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
      }catch(e){
        console.error("印刷の呼び出しに失敗しました:", e);
        alert("印刷ダイアログを開けませんでした。お使いのブラウザで再度お試しください。");
      }
      setTimeout(cleanup, 2000);
    }, 250);
  }

  // 「PDF出力する」ボタンの本体処理。
  // 1) html2canvas・jsPDFを（初回のみ）CDNから読み込む
  // 2) 画面外の#pdfRenderContainerにレポートを描画する
  // 3) それを画像として撮影し、PDFに貼り付けて直接ダウンロードする
  // ライブラリが読み込めない場合（オフライン等）は、従来の印刷ダイアログ方式に
  // 自動的に切り替わる。
  function exportMonthlyPDF(){
    const container = el("pdfRenderContainer");
    if(!container) return;
    setPdfButtonBusy(true);

    ensurePdfLibs().then(function(){
      container.innerHTML = buildPrintReportHTML();
      return window.html2canvas(container, {
        scale: 2,
        backgroundColor: "#ffffff",
        useCORS: true
      });
    }).then(function(canvas){
      const pdf = buildPdfFromCanvas(canvas, window.jspdf.jsPDF);
      const fileMonth = currentMonth; // YYYY-MM
      pdf.save(`ふたり家計簿_${fileMonth}.pdf`);
    }).catch(function(e){
      console.error("PDFの直接出力に失敗したため、印刷ダイアログ方式に切り替えます:", e);
      exportMonthlyPDFViaPrint();
    }).finally ? undefined : null; // (古い一部ブラウザ対策：finally未使用の代わりに下でthen/catchを両方処理)

    // Promise.prototype.finally 相当の処理を then/catch 両方に仕込む（互換性重視のため）
    // 上のチェーンとは別に、後片付け専用の軽いチェーンを続けて実行する。
    ensurePdfLibs().then(function(){
      // 何もしない（上のチェーンで処理済み）。ここでは後片付けのタイミングだけ揃える。
    }).catch(function(){}).then(function(){
      setTimeout(function(){
        setPdfButtonBusy(false);
        container.innerHTML = "";
      }, 500);
    });
  }

  function mergeIncoming(parsed){
    const addedRecords = []; // [{kind, record}]
    ["incomes","expenses","savings"].forEach(function(k){
      const existingIds = new Set(data[k].map(function(x){ return x.id; }));
      (parsed[k] || []).forEach(function(item){
        if(item && item.id && !existingIds.has(item.id)){
          data[k].push(item);
          existingIds.add(item.id);
          addedRecords.push({kind: k, record: item});
        }
      });
    });
    // 予算は「まだ自分の端末で設定していないカテゴリーのみ」取り込む
    // （すでに設定済みの予算を、古いバックアップで上書きしてしまわないようにするため）。
    let budgetsChanged = false;
    if(parsed.budgets && typeof parsed.budgets === "object"){
      Object.keys(parsed.budgets).forEach(function(cat){
        if(!(cat in data.budgets)){
          data.budgets[cat] = parsed.budgets[cat];
          budgetsChanged = true;
        }
      });
    }
    return { addedRecords: addedRecords, budgetsChanged: budgetsChanged };
  }

  function importDataFromFile(file){
    const reader = new FileReader();
    reader.onload = function(){
      let parsed, mergeResult;
      try{
        parsed = JSON.parse(reader.result);
        mergeResult = mergeIncoming(parsed);
      }catch(e){
        console.error(e);
        alert("ファイルの読み込みに失敗しました。書き出し機能で作成したファイルを選択してください。");
        return;
      }
      const addedRecords = mergeResult.addedRecords;
      let savePromise;
      if(storageMode === "realtime" && addedRecords.length){
        // レコードごとにFirebaseへ書き込む（1件ずつ順番に処理する）
        savePromise = addedRecords.reduce(function(chain, item){
          return chain.then(function(){
            const clone = Object.assign({}, item.record);
            delete clone.id;
            return window.firebaseSync.writeRecord(HOUSEHOLD_ID, item.kind, item.record.id, clone);
          });
        }, Promise.resolve());
        if(mergeResult.budgetsChanged){
          savePromise = savePromise.then(function(){
            return window.firebaseSync.setBudgets(HOUSEHOLD_ID, data.budgets);
          });
        }
      }else{
        savePromise = saveData();
      }
      savePromise.then(function(){
        render();
        renderTabs();
        alert(addedRecords.length > 0 ? (addedRecords.length + "件のデータを取り込みました。") : "新しく取り込めるデータはありませんでした（すでに同じ内容が登録されています）。");
      });
    };
    reader.readAsText(file);
  }

  function flashSaved(){

  function monthLabel(m){
    const [y,mo] = m.split("-");
    return y + "年" + parseInt(mo,10) + "月";
  }
  function shiftMonth(delta){
    const [y,mo] = currentMonth.split("-").map(Number);
    const d = new Date(y, mo-1+delta, 1);
    currentMonth = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
    render();
  }
  function inMonth(dateStr){ return dateStr && dateStr.slice(0,7) === currentMonth; }

  // ---------- Layout ----------
  // ヘッダー・ハンバーガーメニューは全ページ共通。中身（#pageContent）だけを

  // ---------- 先月の固定費をコピーする ----------
  function copyLastMonthFixed(){
    const [y, m] = currentMonth.split("-").map(Number);
    const prevDate = new Date(y, m - 2, 1); // m は1始まり。前月の1日を求める
    const prevMonth = prevDate.getFullYear() + "-" + String(prevDate.getMonth() + 1).padStart(2, "0");
    const prevFixed = data.expenses.filter(function(e){
      return e.type === "fixed" && e.date.slice(0, 7) === prevMonth;
    });
    if(!prevFixed.length){
      alert(monthLabel(prevMonth) + "の固定費の記録が見つかりませんでした。");
      return;
    }
    const alreadyHasThisMonth = data.expenses.some(function(e){
      return e.type === "fixed" && inMonth(e.date);
    });
    const confirmMsg = alreadyHasThisMonth
      ? "今月にはすでに固定費の記録があります。" + monthLabel(prevMonth) + "の固定費（" + prevFixed.length + "件）をそれとは別に追加しますか？"
      : monthLabel(prevMonth) + "の固定費（" + prevFixed.length + "件）を、" + monthLabel(currentMonth) + "分としてコピーします。よろしいですか？";
    if(!confirm(confirmMsg)) return;

    const targetDate = currentMonth + "-01";
    let chain = Promise.resolve();
    prevFixed.forEach(function(src){
      chain = chain.then(function(){
        const record = buildRecordBase({
          type: "fixed",
          date: targetDate,
          category: src.category,
          memo: src.memo,
          amount: src.amount
        });
        return persistAdd("expenses", record);
      });
    });
    chain.then(function(){
      renderExpensePanel();
      renderDashboardPanel();
      alert(prevFixed.length + "件の固定費をコピーしました。金額が変わっている場合は、内容を修正してください。");
    });
  }

      });
      persistAdd("savings", record).then(function(){
        renderSavingPanel(); renderDashboardPanel();
      });
    };
    bindDelete("panel-saving");
  }

  // ---------- Delete (shared) ----------
  function bindDelete(panelId){
    each(el(panelId).querySelectorAll(".del"), function(btn){
      btn.onclick = function(){
        const kind = btn.dataset.kind, id = btn.dataset.id;
        persistDelete(kind, id).then(function(){
          renderIncomePanel(); renderExpensePanel(); renderSavingPanel(); renderDashboardPanel();
        });
      };
    });
  }

  // ---------- Dashboard ----------
  function renderDashboardPanel(){
    if(!el("panel-dashboard")) return;
    const incomes = data.incomes.filter(i=>inMonth(i.date));
    const fixed = data.expenses.filter(e=>inMonth(e.date) && e.type==="fixed");
    const variable = data.expenses.filter(e=>inMonth(e.date) && e.type==="variable");
    const savings = data.savings.filter(s=>inMonth(s.date));

    const totalIncome = incomes.reduce((s,i)=>s+i.amount,0);
    const totalFixed = fixed.reduce((s,i)=>s+i.amount,0);
    const totalVariable = variable.reduce((s,i)=>s+i.amount,0);
    const totalExpense = totalFixed + totalVariable;
    const totalSaving = savings.reduce((s,i)=>s+i.amount,0);
    const balance = totalIncome - totalExpense - totalSaving;
    const savingRate = totalIncome > 0 ? Math.round((totalSaving/totalIncome)*100) : 0;

    function byCategory(list, cats, keyFn, labelFn){
      return cats.map(c=>{
        const sum = list.filter(x=>keyFn(x)===c.key).reduce((s,x)=>s+x.amount,0);
        return {label: labelFn ? labelFn(c) : c.key, color:c.color, sum};
      }).filter(x=>x.sum>0);
    }
    const incomeBd = byCategory(incomes, INCOME_CATS, x=>x.category, c=>c.label);
    const fixedBd = byCategory(fixed, FIXED_CATS, x=>x.category, c=>c.key);
    const variableBd = byCategory(variable, VARIABLE_CATS, x=>x.category, c=>c.key);
    const savingBd = byCategory(savings, SAVING_CATS, x=>x.category, c=>c.label);

    function legend(list){
      if(!list.length) return `<li class="empty-row">データがありません</li>`;
      return list.map(x=>`<li><span class="legend-name"><span class="cat-dot" style="background:${x.color}"></span>${x.label}</span><span class="amt">${yen(x.sum)}</span></li>`).join("");
    }

    // 変動費だけは、予算が設定されているカテゴリーについて達成率も表示する
    function legendWithBudget(list){
      if(!list.length) return `<li class="empty-row">データがありません</li>`;
      return list.map(function(x){
        const budget = data.budgets && data.budgets[x.label];
        const row1 = `<div class="legend-row"><span class="legend-name"><span class="cat-dot" style="background:${x.color}"></span>${x.label}</span><span class="amt">${yen(x.sum)}</span></div>`;
        if(!budget){ return `<li>${row1}</li>`; }
        const pct = Math.round((x.sum / budget) * 100);
        const over = x.sum > budget;
        const barColor = over ? "var(--danger)" : (pct >= 80 ? "var(--gold)" : "var(--income)");
        const row2 = `
          <div class="legend-budget" style="color:${over ? "var(--danger)" : "var(--ink-soft)"};">
            予算 ${yen(budget)}中 ${pct}%${over ? "（予算超過）" : ""}
          </div>
          <div class="budget-bar-track"><div class="budget-bar-fill" style="width:${Math.min(pct,100)}%;background:${barColor};"></div></div>
        `;
        return `<li>${row1}${row2}</li>`;
      }).join("");
    }

    el("panel-dashboard").innerHTML = `
      <div class="stat-grid">
        <div class="stat income"><div class="label">収入合計</div><div class="value">${yen(totalIncome)}</div></div>
        <div class="stat expense"><div class="label">支出合計（固定+変動）</div><div class="value">${yen(totalExpense)}</div></div>
        <div class="stat saving"><div class="label">貯金・積立合計</div><div class="value">${yen(totalSaving)}</div></div>
        <div class="stat balance"><div class="label">収支（残り）</div><div class="value">${yen(balance)}</div></div>
      </div>
      <div class="card print-card">
        <h2>この月の記録をPDFで出力する</h2>
        <p class="hint">${monthLabel(currentMonth)}分の収支サマリーと明細を、印刷・保管しやすい1枚のレポートにまとめて出力します。毎週・毎月の記録用にご利用ください。</p>
        <button class="add-btn" id="pdfExportBtn">🖨️ ${monthLabel(currentMonth)}のレポートをPDF出力する</button>
      </div>
      <div class="card">
        <h2>${monthLabel(currentMonth)}の収支バランス <span style="font-size:12px;color:var(--ink-soft);font-weight:400;">貯蓄率 ${savingRate}%</span></h2>
        <div class="charts">
          <div class="chart-box" id="barChart"></div>
          <div class="chart-box" id="expensePie"></div>
        </div>
      </div>
      <div class="breakdown">
        <div class="card">
          <h2>収入の内訳</h2>
          <ul class="legend-list">${legend(incomeBd)}</ul>
        </div>
        <div class="card">
          <h2>貯金・資産形成の内訳</h2>
          <ul class="legend-list">${legend(savingBd)}</ul>
        </div>
        <div class="card">
          <h2>固定費の内訳</h2>
          <ul class="legend-list">${legend(fixedBd)}</ul>
        </div>
        <div class="card">
          <h2>変動費の内訳<span style="font-size:11px;color:var(--ink-soft);font-weight:400;"> ／ 予算はマイページと支出タブから設定できます</span></h2>
          <ul class="legend-list with-budget">${legendWithBudget(variableBd)}</ul>
        </div>
      </div>
    `;
    // stash breakdown for chart drawing
    renderDashboardPanel._ctx = {totalIncome, totalFixed, totalVariable, totalSaving, balance, fixedBd, variableBd};
    if(activeTab === "dashboard") drawCharts();
    if(el("pdfExportBtn")){
      el("pdfExportBtn").onclick = exportMonthlyPDF;
    }
  }

  // 外部グラフライブラリを使わず、SVGだけで棒グラフ・ドーナツグラフを描画する。
  // 通信環境がなくても、単体のHTMLファイルとしてスマートフォンで開いても必ず表示される。
  function drawBarChartSVG(items){
    const max = Math.max(1, ...items.map(i=>i.value));
    const w = 340, h = 210, padBottom = 28, padTop = 16, barGap = 22;
    const barW = (w - barGap*(items.length+1)) / items.length;
    let bars = "";
    items.forEach((it, i)=>{
      const bh = Math.max(2, (it.value/max) * (h - padBottom - padTop));
      const x = barGap + i*(barW+barGap);
      const y = h - padBottom - bh;
      bars += `
        <rect x="${x}" y="${y}" width="${barW}" height="${bh}" rx="5" fill="${it.color}"></rect>
        <text x="${x+barW/2}" y="${y-7}" text-anchor="middle" font-size="10.5" fill="#26313A" font-weight="600">${yen(it.value)}</text>
        <text x="${x+barW/2}" y="${h-9}" text-anchor="middle" font-size="11" fill="#5C6B74">${it.label}</text>
      `;
    });
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="100%" role="img" aria-label="収入・固定費・変動費・貯金の比較棒グラフ">
      <line x1="18" y1="${h-padBottom}" x2="${w-10}" y2="${h-padBottom}" stroke="#E3D9C4"></line>
      ${bars}
    </svg>`;
  }

  function drawDonutChartSVG(items){
    const size = 200, r = 72, cx = size/2, cy = size/2, stroke = 30;
    const circumference = 2 * Math.PI * r;
    const total = items.reduce((s,i)=>s+i.sum, 0);
    if(!items.length || total <= 0){
      return `<svg viewBox="0 0 ${size} ${size}" width="100%" height="100%">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#E3D9C4" stroke-width="${stroke}"></circle>
        <text x="${cx}" y="${cy+4}" text-anchor="middle" font-size="12" fill="#5C6B74">支出データなし</text>
      </svg>`;
    }
    let offset = 0;
    let segs = "";
    items.forEach(it=>{
      const frac = it.sum / total;
      const len = frac * circumference;
      segs += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${it.color}" stroke-width="${stroke}"
        stroke-dasharray="${len} ${circumference-len}" stroke-dashoffset="${-offset}"
        transform="rotate(-90 ${cx} ${cy})"></circle>`;
      offset += len;
    });
    return `<svg viewBox="0 0 ${size} ${size}" width="100%" height="100%" role="img" aria-label="支出カテゴリー別の内訳ドーナツグラフ">
      ${segs}
      <circle cx="${cx}" cy="${cy}" r="${r-stroke/2-4}" fill="var(--paper-raised)"></circle>
      <text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="11" fill="#5C6B74">支出合計</text>
      <text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="13.5" fill="#26313A" font-weight="700">${yen(total)}</text>
    </svg>`;
  }

  function drawCharts(){
    const ctx = renderDashboardPanel._ctx;
    if(!ctx) return;
    const barBox = el("barChart");
    if(barBox){
      barBox.innerHTML = drawBarChartSVG([
        {label:"収入", value:ctx.totalIncome, color:"#3F8564"},
        {label:"固定費", value:ctx.totalFixed, color:"#3A5A82"},
        {label:"変動費", value:ctx.totalVariable, color:"#B4623F"},
        {label:"貯金・積立", value:ctx.totalSaving, color:"#B4913A"}
      ]);
    }
    const pieBox = el("expensePie");
    if(pieBox){
      pieBox.innerHTML = drawDonutChartSVG([...ctx.fixedBd, ...ctx.variableBd]);
    }
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
  }

  function showFatalError(){
    el("app").innerHTML = '<div class="error-screen">' +
      '<p><strong>読み込み中に問題が発生しました。</strong><br>' +
      'お使いのブラウザで開き直すか、下のボタンで再読み込みしてください。<br>' +
      '（Safari／Chromeなどのブラウザで開いていることをご確認ください）</p>' +
      '<button onclick="location.reload()">再読み込みする</button></div>';
  }

  // 画面幅は@media(CSS)で自動判定しているが、それに加えて「タッチで操作しているか」も
  // 判定し、該当する場合は<html>にis-touchクラスを付与してタップ領域を広げる。
  // ユーザーエージェント文字列の判定は機種偽装等で誤判定しやすいため使わず、
  // 実際の入力方式（ポインターの種類）で判定している。
  function applyDeviceClass(){
    try{
      const isTouch = (window.matchMedia && window.matchMedia("(pointer: coarse)").matches)
        || ("ontouchstart" in window)
        || (navigator.maxTouchPoints && navigator.maxTouchPoints > 0);
      document.documentElement.classList.toggle("is-touch", !!isTouch);
    }catch(e){
      console.log("デバイス判定に失敗しました（表示には影響しません）:", e);
    }
  }

  function init(){
    try{
      loadData().then(function(){
        render();
        activeTab = "income";
        renderTabs();
      }).catch(function(e){
        console.error("初期化エラー:", e);
        showFatalError();
      });
    }catch(e){
      console.error("初期化エラー:", e);
      showFatalError();
    }
  }

  // ---------- ログイン画面（メール／パスワード） ----------
  function renderAuthGate(mode, errorMsg){
    mode = mode || "login";
    el("app").innerHTML = `
      <div class="app-header">
        <div class="brand">
          <div class="brand-mark">家</div>
          <div class="brand-text">
            <h1>ふたり家計簿</h1>
            <p>HOUSEHOLD LEDGER FOR TWO</p>
          </div>
        </div>
      </div>
      <div class="card" style="max-width:420px;margin:24px auto;">
        <h2>${mode === "register" ? "新規登録" : "ログイン"}</h2>
        <p class="hint">${mode === "register"
          ? "メールアドレスとパスワード（6文字以上）でアカウントを作成します。友人・パートナーとそれぞれ別のアカウントで登録し、あとで招待コードを使って同じ家計につなげてください。"
          : "登録済みのメールアドレスとパスワードでログインしてください。"}</p>
        <div class="field"><label>メールアドレス</label><input type="email" id="auth-email" autocomplete="email"></div>
        <div class="field"><label>パスワード</label><input type="password" id="auth-password" autocomplete="${mode === "register" ? "new-password" : "current-password"}"></div>
        ${errorMsg ? `<p style="color:var(--danger);font-size:12.5px;margin:-4px 0 12px;">${escapeHtml(errorMsg)}</p>` : ""}
        <button class="add-btn" id="auth-submit-btn" style="width:100%;margin-bottom:10px;">${mode === "register" ? "登録する" : "ログインする"}</button>
        <button class="ghost-btn" id="auth-toggle-btn" style="width:100%;">${mode === "register" ? "すでにアカウントをお持ちの方はこちら" : "はじめての方はこちら（新規登録）"}</button>
      </div>
      <div class="card" style="max-width:420px;margin:0 auto;">
        <button class="ghost-btn" id="auth-skip-btn" style="width:100%;">ログインせずこの端末だけで使う</button>
        <p class="hint" style="margin-top:8px;margin-bottom:0;">ログインしない場合、この端末の中だけにデータが保存され、他の人とは自動共有されません。</p>
      </div>
    `;
    el("auth-toggle-btn").onclick = function(){
      renderAuthGate(mode === "register" ? "login" : "register");
    };
    el("auth-skip-btn").onclick = function(){
      init();
    };
    el("auth-submit-btn").onclick = function(){
      const email = el("auth-email").value.trim();
      const password = el("auth-password").value;
      if(!email || !password){
        renderAuthGate(mode, "メールアドレスとパスワードを入力してください。");
        return;
      }
      const action = mode === "register" ? window.firebaseSync.auth.register : window.firebaseSync.auth.login;
      action(email, password).catch(function(e){
        console.error("認証エラー:", e);
        renderAuthGate(mode, "ログインに失敗しました。メールアドレス・パスワードをご確認ください。");
      });
      // 成功時はonAuthStateChangedのコールバック側で画面遷移するため、ここでは何もしない
    };
  }

  // ---------- 世帯（household）作成・参加画面 ----------
  function renderHouseholdSetup(user, resolve, errorMsg){
    el("app").innerHTML = `
      <div class="app-header">
        <div class="brand">
          <div class="brand-mark">家</div>
          <div class="brand-text">
            <h1>ふたり家計簿</h1>
            <p>HOUSEHOLD LEDGER FOR TWO</p>
          </div>
        </div>
      </div>
      <div class="card" style="max-width:460px;margin:24px auto;">
        <h2>家計を始める</h2>
        <p class="hint">ログインしました（${escapeHtml(user.email || "")}）。新しく家計を作成するか、パートナーや友人から共有された招待コードを入力して参加してください。</p>
        <button class="add-btn" id="hh-create-btn" style="width:100%;margin-bottom:18px;">新しい家計を始める</button>
        <div class="field"><label>招待コード（パートナー・友人から共有されたもの）</label><input type="text" id="hh-code-input" placeholder="例：ab12cd34ef56..."></div>
        <button class="ghost-btn" id="hh-join-btn" style="width:100%;">招待コードで参加する</button>
        <p class="hint" style="margin-top:10px;">以前（ログイン機能を追加する前）から使っていたデータを引き継ぐ場合は、招待コードの欄に次の値を入力してください。<br><code style="font-size:11px;word-break:break-all;">${LEGACY_HOUSEHOLD_ID}</code></p>
        ${errorMsg ? `<p style="color:var(--danger);font-size:12.5px;margin:12px 0 0;">${escapeHtml(errorMsg)}</p>` : ""}
      </div>
      <div class="card" style="max-width:460px;margin:0 auto;">
        <button class="ghost-btn" id="hh-logout-btn" style="width:100%;">ログアウトする</button>
      </div>
    `;
    el("hh-create-btn").onclick = function(){
      window.firebaseSync.createHousehold(user.uid).then(function(id){
        resolve(id);
      }).catch(function(e){
        console.error(e);
        renderHouseholdSetup(user, resolve, "家計の作成に失敗しました。もう一度お試しください。");
      });
    };
    el("hh-join-btn").onclick = function(){
      const code = el("hh-code-input").value.trim();
      if(!code){
        renderHouseholdSetup(user, resolve, "招待コードを入力してください。");
        return;
      }
      window.firebaseSync.joinHousehold(user.uid, code).then(function(id){
        resolve(id);
      }).catch(function(e){
        console.error(e);
        renderHouseholdSetup(user, resolve, "参加に失敗しました。招待コードをご確認ください。");
      });
    };
    el("hh-logout-btn").onclick = function(){
      window.firebaseSync.auth.logout();
    };
  }

  function resolveHousehold(user){
    return window.firebaseSync.getUserHousehold(user.uid).then(function(id){
      if(id){ return id; }
      return new Promise(function(resolve){
        renderHouseholdSetup(user, resolve);
      });
    });
  }

  // 画面幅は@media(CSS)で自動判定しているが、それに加えて「タッチで操作しているか」も
  // 判定し、該当する場合は<html>にis-touchクラスを付与してタップ領域を広げる。
  // ユーザーエージェント文字列の判定は機種偽装等で誤判定しやすいため使わず、
  // 実際の入力方式（ポインターの種類）で判定している。
  function applyDeviceClass(){
    try{
      const isTouch = (window.matchMedia && window.matchMedia("(pointer: coarse)").matches)
        || ("ontouchstart" in window)
        || (navigator.maxTouchPoints && navigator.maxTouchPoints > 0);
      document.documentElement.classList.toggle("is-touch", !!isTouch);
    }catch(e){
      console.log("デバイス判定に失敗しました（表示には影響しません）:", e);
    }
  }

  function bootstrap(){
    applyDeviceClass();
    // 1) Claudeのアーティファクト上で動作している場合は、ログイン不要でそのまま従来通り
    if(typeof window.storage !== "undefined" && window.storage && typeof window.storage.get === "function"){
      init();
      return;
    }
    // 2) Firebaseが設定されている場合は、ログイン → 家計の作成/参加 → 通常起動、の順で進める
    if(window.firebaseSync && window.firebaseSync.configured && window.firebaseSync.auth){
      let started = false;
      renderAuthGate("login");
      window.firebaseSync.auth.onChange(function(user){
        if(user){
          currentUser = user;
          resolveHousehold(user).then(function(id){
            HOUSEHOLD_ID = id;
            if(!started){ started = true; init(); }
          }).catch(function(e){
            console.error("家計情報の取得に失敗しました:", e);
            renderAuthGate("login", "情報の取得に失敗しました。もう一度ログインしてください。");
          });
        }else{
          currentUser = null;
          HOUSEHOLD_ID = null;
          if(!started){ renderAuthGate("login"); }
        }
      });
      return;
    }
    // 3) Firebase自体が使えない場合は、ログイン画面を出さずそのまま端末内保存で起動する
    init();
  }
  // Firebase用の<script type="module">は、HTML解析が完了してから実行される仕様のため、
  // このスクリプト（type指定なしの通常スクリプト）の方が先に実行されてしまうことがある。
  // window.firebaseSyncの設定が間に合うよう、DOMContentLoaded（読み込み完了）を待ってから
  // 初期化する。
  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", bootstrap);
  }else{
    bootstrap();
  }
})();
</script>
